tient stratification, adaptive decoding, individualized feedback, standardized outcomes, and real-world validation.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42694671/", "scraped_at": "2026-09-05T21:30:48.975347+00:00", "spider_name": "pubmed"}, {"pmid": "42694580", "title": "Shielding the First 24 Postnatal Months of Life: A Proposal for a Prospective Cohort Study of Early-Life Electromagnetic Exposure and Autism Risk.", "authors": ["Garoli Alberto", "Greco Alessandro"], "journal": "Alpha psychiatry", "pub_date": "2026-08-24", "doi": "10.31083/AP53282", "abstract": "Autism Spectrum Disorder (ASD) involves Mirror Neuron System (MNS) dysfunction, driving core social and imitative impairments. Systemic physiological alterations such as autonomic dysregulation, mitochondrial dysfunction and neuroinflammation are known to impair synchronization and plasticity of neuronal clusters. A less-evident environmental cofactor, coinciding with rising ASD prevalence, is the considerable world-wide increase in electromagnetic radiation (EMR) overall exposure among children. Experimental evidence shows how low-intensity EMR influences cellular processes, via voltage-gated calcium channels (VGCCs), oxidative stress, and mitochondrial metabolism. The Resonant Convergence framework, allow to predict how chronic EMR exposure during the first 24 postnatal months of life can act as a factor in ASD pathogenesis. The best candidate mechanism is chronic Ion Cyclotron Resonance (ICR) detuning the Ca2+-calmodulin pathway, thus disrupting MNS synchronization. A prospective observational pilot cohort study (24-month follow-up) proposes to enroll 1000 full-term newborns into two arms: an EMR-reduced cohort (n = 500, rest and sleep-phase Faraday shielding) and a standard exposure cohort (n = 500). Exposure is quantified via radiofrequency (RF)/extremely low frequency(ELF) measurements, proximity analysis, device inventories and wearable dosimetry. The primary endpoint is a continuous neurodevelopmental trajectory score (joint attention, language, electroencephalogram (EEG) mu-rhythm); binary ASD diagnosis (Autism Diagnostic Observation Schedule, Second Edition (ADOS-2), Autism Diagnostic Interview-Revised (ADI-R)) is a secondary, exploratory endpoint. Moreover, an optional genomic screening will evaluate gene-environment interactions within extremely low-frequency electromagnetic field (ELF-EMF) vulnerable pathways, including ASD-associated genes upregulated by RF via bromodomain and extraterminal protein (BET)-mediated epigenetic mechanisms. Analyses will employ risk ratios, Fisher's exact tests and logistic regression adjusted for confounders; mixed-effects and Bayesian modeling will evaluate longitudinal outcomes and exposure reduction effects. Given a 2-3% baseline prevalence, approximately 20-30 ASD cases are expected. The study is therefore powered for exploratory signal detection rather than definitive causal inference, providing the critical baseline data required to justify and design future confirmatory trials. Sex-stratified modeling will address the 4:1 male-to-female prevalence ratio. Ethics committee approval is not yet sought; full protocol review and approval will be obtained prior to the study initiation, in strict accordance with the Declaration of Helsinki. Written parental informed consent will be mandatory for all participants prior to enrollment. Study findings and methodological milestones will be disseminated through peer-reviewed international scientific publications. This protocol provides a structured methodological framework for the first prospective investigation of sleep-phase EMR reduction as a potential modulator of ASD incidence during early neurodevelopment. Results will inform adequately powered confirmatory trials in electromagnetic neurodevelopmental epidemiology.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42694580/", "scraped_at": "2026-09-05T21:30:48.975347+00:00", "spider_name": "pubmed"}], "biorxiv": [{"doi": "10.64898/2026.08.25.747062", "title": "A neuro-computational approximation of the qualities of mental images", "authors": "Stecher, R.; Kaiser, D.", "category": "neuroscience", "server": "biorxiv", "abstract": "Mental images are challenging to study, given that our conscious experience is notoriously hard to access. The currently prevalent introspective methods are inherently subjective and can thus only provide limited access to their qualities. Here, we developed a neuro-computational approach that approximates and assesses the properties of mental images without the need for introspection. To enable this approach, we collected a large-scale EEG dataset (10 participants, 10 sessions each, 43,200 trials total) of participants imagining 16 scenes based on text prompts. We employed AI image generation to create candidate image sets that approximate the content of mental images (based on the imagined text prompts), computationally simulated visual cortex responses to these images and then assessed their representational alignment with rhythmic EEG responses during imagery. In line with previous reports, mid- to high-level features of the AI-generated candidate images yielded reliable alignment with human alpha activity. By manipulating the qualities of the candidate images, we then tested which qualities predisposed higher representational alignment with cortical imagery representations. We found an increased representational alignment for spatially blurred and low contrast images, providing evidence for the prevalent notion of a reduced sensory quality of mental images. We further found that mental imagery may be characterized by a psychedelic image style, which envelops the images in visual flows that distort the image proportions. These results show that our approach can objectively capture qualities of mental images without the need of introspection, providing a hypothesis-based alternative to emerging reconstruction approaches.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.08.25.747062", "scraped_at": "2026-09-05T21:30:59.133254+00:00", "spider_name": "biorxiv"}, {"doi": "10.1101/2025.08.06.668906", "title": "Precision Functional Mapping of Imagined and Experienced Pain", "authors": "Sun, M.; Petre, B.; Bo, K.; Bango, C. I.; Hershkop, M.; Shohan, S. L.; Jung, H.; Wager, T. D.", "category": "neuroscience", "server": "biorxiv", "abstract": "Imagination is a principal human capacity, enabling simulation of sensations and situations for planning, learning, and empathy. We examined neural representations of experienced and imagined pain across eight body sites using deep-phenotyping, precision functional MRI with over seven hours of scanning per participant (N = 9). Here we show, using conventional mapping, pattern classification, and representational similarity analyses, that both imagined and experienced pain activated nociceptive regions (e.g., dorsoposterior insula) and non-nociceptive regions (e.g., premotor areas). However, imagined pain did not reliably reactivate body site-selective nociceptive patterns in any region. Instead, imagined and experienced pain shared multivariate representations across widespread cortical and subcortical regions, particularly transmodal cortical areas including dorsomedial and lateral prefrontal cortex, hippocampus, and thalamus. These findings suggest that imagination generates distributed pain-like activity while preserving a neural distinction from experienced pain. This distinction may explain the difficulty of vividly imagining pain and underlie its role in empathy, planning, and pain vulnerability.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.1101/2025.08.06.668906", "scraped_at": "2026-09-05T21:30:59.133254+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.05.27.728254", "title": "iClima: a ratiometric genetically encoded sensor for optical imaging of fast GABAergic chloride currents in vitro and in vivo", "authors": "Pasquini, G.; Giubbolini, S.; Nardi, G.; Brondi, M.; Beyene, E.; Balsi, C.; Egidi, A.; Tsushima Semini, H.; Landi, S.; Stancampiano, M.; Beale, A. D.; Watson, E. M.; Edgar, R. S.; ONeill, J. S.; Arosio, D.; Santi, M.; Fassio, A.; Lodovichi, C.; Ratto, G. M.", "category": "neuroscience", "server": "biorxiv", "abstract": "Fast GABAergic inhibition in the brain is mediated by chloride currents whose driving force depends on intracellular Chloride concentration ([Cl-]i). Resolving the spatiotemporal dynamics of [Cl-]i in neurons requires a sensor combining high Cl- affinity, pH independence, and photostability - properties no existing tool achieves simultaneously. Here we introduce iClima (improved Chloride Imaging), a ratiometric genetically encoded sensor with high Cl- affinity (Kd=3.5 mM at pH 7.2), pH-insensitive under physiological conditions, and markedly improved photostability compared to existing sensors. These properties enable dynamic Cl- imaging without simultaneous pH correction. We demonstrate that iClima resolves GABAA-driven Cl- transients in cultured neurons, detects discrete Cl- hotspots along dendrites, and captures sensory-evoked Cl- transients in vivo. Finally, exploiting the spectral compatibility of iClima with GCaMP6f, we measure in interleaved trials Cl- and Ca2+ transients in the same neurons in vivo, revealing a divergence between the somatic inhibitory drive and the neuronal excitation state as reported by Ca2+ dynamics.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.05.27.728254", "scraped_at": "2026-09-05T21:30:59.133254+00:00", "spider_name": "biorxiv"}, {"doi": "10.1101/2025.04.19.649630", "title": "Covalent anti-HIV compound that induces HIV-1 capsid multimerization and degradation, decomposes the viral core", "authors": "Nakamura, T.; Takamune, N.; Okumura, M.; Yasunaga, J.-i.; Sugiura, M.; Amano, M.", "category": "molecular biology", "server": "biorxiv", "abstract": "Covalent inhibitors form strong, essentially irreversible interactions with their targets, offering enhanced structural selectivity within the target cavity and prolonged target engagement even at low doses. Here, we report that ACAi-001, an HIV-1 capsid (CA)-targeting compound identified through in silico screening of the hydrophobic cavity in the CA N-terminal domain (CA-NTD), inhibits HIV-1 replication in cell-based assays. ACAi-001 covalently binds CA to induce aberrant CA multimerization and degradation in vitro, a pharmacological property distinct from that of existing CA inhibitors such as lenacapavir. This mechanism was confirmed by Western blotting (WB), size exclusion chromatography (SEC), differential scanning fluorimetry (DSF), and liquid chromatography-mass spectrometry (LC-MS). These results suggest that ACAi-001, with two putative covalent interactions in its chemical structure, binds directly to Ser16 in the N-terminal domain targeting cavity in addition to Cys198 or Cys218 in the C-terminal domain of CA. The treatment of viral particles with ACAi-001 results in the loss of intact, conical HIV-1 cores, as directly visualized by transmission electron microscopy (TEM), establishing the HIV-1 core as the direct target of ACAi-001. These findings demonstrated that ACAi-001 may be a promising next-generation anti-HIV-1 CA inhibitor with unique mechanisms of action, offering new insight into HIV-1 core assembly and disassembly.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.1101/2025.04.19.649630", "scraped_at": "2026-09-05T21:30:59.133254+00:00", "spider_name": "biorxiv"}, {"doi": "10.1101/2025.11.12.687954", "title": "Structural basis for co-translational assembly of homo-oligomeric proteins in cis and in trans", "authors": "Koubek, J.; Filbeck, S.; Fixen, G.; Kopetschke, S.; Schmitt, J.; Pfeffer, S.; Kramer, G.; Bukau, B.", "category": "molecular biology", "server": "biorxiv", "abstract": "The efficient formation of protein complexes is essential for cellular function. Across all kingdoms of life, protein complexes frequently assemble co-translationally, either when one subunit is fully synthesized before interaction with nascent partner subunits (co-post) or when multiple nascent subunits interact co-translationally (co-co), with homomeric proteins particularly enriched among co-co assembling complexes. However, it is unknown whether co-co assembly of homomers occurs on the same mRNA in cis or across neighbouring mRNAs in trans, and how ribosomes spatially organize to enable co-co assembly. Using E. coli homodimeric protein PheA as a proof-of-concept model, we show by ribosome profiling and cryo-EM structural analysis that it employs the co-co assembly route. Co-co assembly of PheA is facilitated by the proximity of polypeptide exit tunnels, but does not rely on fixed ribosomal orientations. Surprisingly, PheA was identified as an exceptional candidate where trans-assembly is potentially the primary mode of PheA co-co assembly, generating large polysomal networks for PheA synthesis. Cis-assembly of PheA was less frequent and occurred mainly between non-adjacent ribosomes on the mRNA due to spatial restraints imposed by the arrangement of directly neighbouring ribosomes in polysomes. These findings reveal fundamental principles of how cells structurally organise fast and efficient co-translational protein complex assembly.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.1101/2025.11.12.687954", "scraped_at": "2026-09-05T21:30:59.133254+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.05.10.724105", "title": "A sibling study of variation in parental mutation rates", "authors": "Getseva, V.; Poyraz, P.; Stolyarova, A.; Agarwal, I.; Przeworski, M.", "category": "genomics", "server": "biorxiv", "abstract": "People are born with variable numbers of de novo germline mutations (DNMs), depending primarily on the ages of their parents. To explore additional causes, we developed an approach to call DNMs from nucleotide differences between siblings in genomic regions inherited identical by descent from both parents. Applying it to whole genome sequences from 28,985 sibling pairs of diverse genetic ancestries present in the UK Biobank and All of Us datasets, as well as 2,330 trios, we identified >800K autosomal DNMs and characterized mutation phenotypes in 27,645 sets of parents. We found subtle shifts in the mutation spectrum but no differences in total DNM rates among genetic ancestry groups, or between smokers and non-smokers. Testing for associations between parental mutation phenotypes and their burden of loss-of-function and deleterious missense variants in a set of 180 DNA repair and maintenance genes, we discovered that disruptions in REV1 and LIG1 increase germline mutation rates, and thus that rare mutator alleles segregate in population cohorts.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.05.10.724105", "scraped_at": "2026-09-05T21:30:59.133254+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.08.26.747434", "title": "Linoleic Acid-Lyso PG Axis promoting lipid droplet-mitochondria tethering by stabilizing Noncanonically Mitochondrial PPAR β/δ to Ameliorate Microglial Dysfunction in subarachnoid hemorrhage", "authors": "Zou, L.-X.; Hu, H.; Liu, X.-z.; shen, j.; Gao, S.; Ding, P.-F.; Tian, K.; Dong, X.; Lu, X.; Liu, R.-y.; Li, X.-J.; Peng, Z.; Chen, X.-X.; Hang, C.; Li, W.", "category": "neuroscience", "server": "biorxiv", "abstract": "Background Microglial lipid handling and mitochondrial failure contribute to brain injury after subarachnoid hemorrhage (SAH), but the lipid signals coupling these processes remain unclear. We investigated whether linoleic acid (LA) restores microglial homeostasis through lysophosphatidylglycerol 16:0 (LPG[16:0]) and peroxisome proliferator-activated receptor-{delta} (PPAR{delta}). Methods Cerebrospinal fluid metabolomics included 30 patients with aneurysmal SAH and 10 control participants. Mechanisms were examined in a blood-injection mouse model and hemoglobin-exposed primary mouse microglia using targeted lipidomics, RNA sequencing, mitochondrial and phagocytosis assays, pharmacological perturbation, fractionation, coimmunoprecipitation, thermal shift analysis, and structural modeling. Behavioral outcomes were evaluated by open-field, Y-maze, and Morris water-maze testing. Results; CSF LA was higher in SAH and discriminated the groups within this cohort (area under the curve, 0.9967 [95% CI, 0.9859-1.000]; P<0.001). LA attenuated inflammatory activation and restored phagocytosis, mitochondrial membrane potential, respiration, and ATP production in hemoglobin-exposed microglia. LA restored PLA2G15-associated LPG(16:0), which phenocopied these effects. Transcriptomic and inhibitor analyses identified PPAR{delta} as a downstream effector. LPG(16:0) increased PPAR{delta} stability, and fractionation and protease protection identified a PPAR{delta} pool on the cytosolic face of the outer mitochondrial membrane. PPAR{delta} associated with PLIN2 and CPT1A, promoted lipid droplet-mitochondria apposition, and supported fatty acid oxidation. In mice, LA reduced neuroinflammatory injury and partially improved anxiety-related behavior and spatial memory.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.08.26.747434", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.05.19.726180", "title": "The microstructure-weighted human connectome: network properties and structure-function correlations across spatial scales", "authors": "Spencer, A. P. C.; Asadi, S.; Aleman-Gomez, Y.; Wang, Q.; Jedynak, M.; Chan, C. H. M.; Cionca, A.; Van De Ville, D.; David, O.; Hagmann, P.; Jelescu, I.", "category": "neuroscience", "server": "biorxiv", "abstract": "Conventional connectome edge weights, such as number of streamlines (NOS) or diffusion tensor imaging (DTI) metrics, lack specificity to microstructural details which may hold relevance for macroscale brain organisation. Since biophysical diffusion modelling offers greater specificity to microstructure, we investigated whether parameters from the Standard Model of white matter diffusion provide informative alternatives for connectome weights - namely the intra-axonal signal fraction (f) and perpendicular extra-axonal diffusivity (DePerp). Using diffusion MRI data from healthy adults, we constructed structural networks at four parcellation scales, weighted by f, DePerp, NOS, fractional anisotropy (FA) and radial diffusivity (RD). While all weights reproduced expected small-world properties and hub structure, only DePerp and normalised NOS captured non-random properties of local organisation at all spatial scales. We then correlated each weighted connectome with resting-state fMRI functional connectivity and intracranial measurements of conduction velocity. At both the whole-brain and regional level, NOS gave strong coupling with fMRI functional connectivity. Connectomes weighted by DePerp, FA and RD gave weak but significant coupling with fMRI functional connectivity and conduction velocity. Notably, DePerp and RD gave highest consistency in regional structure-function coupling across spatial scales. Thus, connectome weights derived from DePerp capture meaningful aspects of brain network organisation with functional relevance.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.05.19.726180", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.08.27.742467", "title": "Targeting Mitochondrial Dysfunction with Mdivi-1 Confers Therapeutic Protection in a Mouse Model of Mustard Keratopathy", "authors": "Guha Mazumder, A.; Magarychoff, E.; Alemi, H.; Raghav, R.; Chin, M. T.; Wiley, C. D.; Fini, M. E.", "category": "molecular biology", "server": "biorxiv", "abstract": "Mustard keratopathy, caused by exposure of the cornea to sulfur or nitrogen mustard vesicants, chemical warfare agents, can lead to severe and often irreversible vision loss. Despite considerable efforts to develop medical countermeasures, including anti-inflammatory, antioxidant, anti-fibrotic, and anti-angiogenic therapies, no treatment effectively targets the underlying mechanisms responsible for mustard-induced tissue injury or prevents long-term disease progression. In the present study, we comprehensively define mitochondrial mechanisms underlying nitrogen mustard-induced corneal injury in both our cell culture model in vitro and a mouse model in vivo. DNM1L (aka Drp1) is a mitochondria-localized dynamin-related GTPase that executes mitochondrial fission and facilitates the autophagic elimination of damaged mitochondrial components. Using complementary in vitro and in vivo models, we demonstrate that nitrogen mustard rapidly induces excessive mitochondrial fragmentation, bioenergetic collapse, membrane depolarization, oxidative stress, intracellular acidification, mitophagy, and apoptotic cell death. Pharmacological inhibition of DNM1L with Mdivi-1 preserves mitochondrial structure and function, restores cellular metabolism, reduces oxidative damage, and markedly improves corneal epithelial integrity, and tissue repair following nitrogen mustard exposure. Collectively, these findings establish mitochondrial dysfunction as a central pathological mechanism in mustard keratopathy and identify DNM1L-mediated mitochondrial remodeling as a therapeutically actionable target. Our work provides strong preclinical evidence supporting mitochondrial-directed therapy as a promising strategy for treating mustard keratopathy.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.08.27.742467", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.06.24.733881", "title": "High-Throughput Screening Identifies Small-Molecule Inhibitors of the Tau-LRP1 Interaction", "authors": "Wang, C.; Ma, C.-T.; Crotty, C.; Zeng, F.-Y.; Bobkov, A.; Covel, J. A.; Keane Rivera, E.; Sergienko, E.; Kosik, K. S.; Olson, S. H.; Jackson, M. R.; Rauch, J. N.", "category": "biochemistry", "server": "biorxiv", "abstract": "The cellular uptake and propagation of tau are central features of tauopathies, including Alzheimers disease, and are mediated by the endocytic receptor low-density lipoprotein receptor-related protein 1 (LRP1). While prior studies have implicated LRP1 in tau binding and internalization, the biochemical features of this interaction and its suitability for therapeutic targeting remain incompletely defined. Here, we establish a quantitative and scalable framework to interrogate the tau-LRP1 interaction and identify small-molecule modulators. We engineered and purified the LRP1 ligand-binding domain 4 (BD4), a key region mediating tau interaction, and developed multiple orthogonal assays, including fluorescence polarization, split luciferase complementation, and time-resolved FRET, to measure LRP1-BD4 interactions with tau and a known peptide ligand. Across assay formats, we observe consistent binding affinities in the nanomolar range and demonstrate competitive displacement by tau, receptor-associated protein (RAP), and a peptide ligand, supporting overlapping binding interfaces. Leveraging these platforms, we performed small molecule high-throughput screening and identified a set of candidate inhibitors of the LRP1-BD4-tau interaction. Selected compounds reduced tau uptake in a cellular assay, phenocopying competitive inhibition by tau and a peptide ligand. Together, these studies define the LRP1-BD4-tau interaction as a biochemically tractable and druggable interface and establish an integrated discovery pipeline linking mechanistic characterization to functional cellular outcomes. This work provides a foundation for the development of therapeutic strategies targeting LRP1-mediated tau uptake.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.06.24.733881", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.03.02.709083", "title": "Magnitude estimation reveals Poisson-like noise underlying perception", "authors": "Rodriguez-Arribas, C.; Lopez-Moliner, J.; Linares, D.", "category": "neuroscience", "server": "biorxiv", "abstract": "Understanding how physical stimuli map onto perceptual experience is the founding goal of psychophysics. Insights into this process have primarily relied on measurements of sensitivity, how finely people tell stimuli apart, but these cannot identify the internal noise distribution underlying perception because they cannot separate it from signal amplification. Here, using visual contrast, we show that the trial-to-trial variability of subjective ratings derived from magnitude estimation, where people rate stimulus intensity with numbers, provides access to this noise. We validated this estimate by demonstrating that the analysis of this variability alongside mean responses reveals an internal representation comprising a sigmoidal response function and Poisson-like noise that quantitatively predicts sensitivity without free parameters. These predictions include the classic phenomena of the pedestal effect and Weber's law, which we can now trace back to the response nonlinearities and signal-dependent noise. These findings establish subjective rating variability as a behavioral measure of internal noise.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.03.02.709083", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.08.27.747680", "title": "High-Resolution Subtyping of Pediatric Low-Grade Glioma Using an Integrated Meta-Clustering Framework", "authors": "Tuerhanbayi, B.; Wang, J.; Wan, S.", "category": "bioinformatics", "server": "biorxiv", "abstract": "Pediatric low-grade glioma (pLGG) is the most common type of brain tumor in children, accounting for approximately 30% of all central nervous system tumors in children. pLGG has multiple molecular subtypes that differ in disease progression, recurrence patterns, and treatment responses. Conventional wet lab approaches including molecular profiling and histopathological studies for pLGG characterization are time consuming, costly, and laborious. Recently, methods based on artificial intelligence (AI) or machine learning (ML) have been widely used for pLGG molecular categorization, but most of them can only identify two or three pLGG subtypes. To more comprehensively characterize the molecular subtypes of pLGG and their potential biological and therapeutic significance, we develop an integrated meta-clustering approach, namely Meta-pLGG, that can explore high resolution molecular subtypes and their transcriptional heterogeneity for pLGG. Specifically, we first performed multiple rounds of random projection (RP) to generate dimension-reduced feature vectors from pLGG transcriptomics data, each of which was subsequently clustered by different clustering algorithms including hierarchical clustering, K-means, Self-Organizing Maps (SOM), Non-negative Matrix Factorization (NMF), Gaussian Mixture Model (GMM), and Spectral Clustering, as base clustering methods. Then, to yield robust clustering performance, we integrated the clustering results of these RP based individual clustering algorithms by adopting a weighted meta-clustering (wMetaC) approach. Results based on 532 pLGG patients suggested that our proposed approach demonstrated superior stability and discriminative powers for higher resolution pLGG subtyping compared to conventional approaches. Based on consensus matrix analysis, we identified two major pLGG mega-subtypes, with one further subdivided into three subgroups and the other into two. Then, we performed cluster specific differential gene expression analysis, molecular pathway analysis, and gene-drug-disease association analysis. The results showed that the identified five subgroups exhibited significant subtype-specific transcriptomic heterogeneity. In summary, our meta-clustering approach demonstrated much higher performance and robustness in identifying higher resolution molecular subtypes of pLGG, revealing the molecular heterogeneity within pLGG and potentially providing new insights for more precise molecular subtyping and precision therapy.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.08.27.747680", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.08.27.747296", "title": "Interactive downstream proteomics analysis with MiraProt using Mueller cell proteomes from equine recurrent uveitis", "authors": "Schmalen, A.; Fleischer, A. B.; Riedel, B. M.; Deeg, C. A.", "category": "bioinformatics", "server": "biorxiv", "abstract": "Mass spectrometry-based proteomics requires downstream analysis of processed protein abundance data, including data inspection, filtering, statistical testing, functional enrichment, protein set comparison, network analysis, and visualization. MiraProt was developed as a modular, metadata-aware R Shiny platform that integrates these steps in a single interactive workflow for processed protein-level proteomics data. Its metadata-aware design enables identifiers, sample information, experimental conditions, transformations, and derived data columns to be defined during data preparation and reused consistently across downstream analyses. To demonstrate its use, we reanalyzed a previously published label-free proteomic dataset of primary retinal Mueller cells from healthy horses and horses with equine recurrent uveitis (ERU). ERU is a naturally occurring autoimmune eye disease of horses characterized by recurrent intraocular inflammation triggered by autoreactive T-cells. Mueller cells are specialized retinal macroglia with various functions such as maintaining retinal ion homeostasis and supporting retinal neuron metabolism. Of 193 proteins with an adjusted p-value [&le;] 0.05, 187 also showed at least a twofold abundance difference between ERU-derived and control Mueller cells. Functional enrichment highlighted nuclear RNA processing, chromatin-associated structures, DNA and RNA binding, interferon responses, and cell-cycle-associated programs. Gene set enrichment analysis identified positive enrichment of Interferon Alpha Response, Interferon Gamma Response, and MYC-, E2F-, and G2M-associated gene sets. Network analysis of shared proteins further linked this signature to DNA replication, mitotic checkpoint control, and RNA processing. ERU-derived Mueller cells also showed increased abundance of MHC class II-associated proteins. Together, these findings identified an interferon-responsive, cell-cycle-associated, and MHC class II-associated Mueller cell protein signature in ERU and generated experimentally testable hypotheses for further mechanistic studies. MiraProt provides an accessible, metadata-aware framework for reproducible downstream exploration of processed proteomic datasets and prioritization of candidate proteins and pathways for experimental follow-up.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.08.27.747296", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.08.28.747711", "title": "Lipid-ASO therapeutics exhibit differential tissue targeted delivery upon systemic or local CNS administration", "authors": "Roudi, S.; Estupinan, H. Y.; Saher, O.; Barradas, C.; Inganas, E.; Le, H.-N.; Frengen, N.; Grochowski, R.; Pavlova, S.; Mansson Welinder, R.; Nordin, J. Z.; Biscans, A.; Matsson, P.; Zain, R.; Sandberg, R.; Hagemann-Jensen, M.; EL Andaloussi, S.", "category": "pharmacology and toxicology", "server": "biorxiv", "abstract": "Antisense oligonucleotides (ASOs) are a powerful therapeutic modality, but their full potential is hindered by pharmacokinetic properties that affect tissue and cellular delivery. Lipid conjugation is increasingly used to modulate ASO's biodistribution and promote extrahepatic activity, yet lipid dependent effects on in vivo functional delivery, particularly in the central nervous system (CNS), remain less explored. Here, we performed a side by side in vivo comparison of cholesterol, palmitic acid (C16:0), docosanoic acid (C22:0), and eicosapentaenoic acid (C20:5) conjugated to a fully phosphorothioated 3 10 3 LNA gapmer ASO targeting the Malat1 long non coding RNA. Lipid-ASO conjugates were administered systemically or locally in the brain of mice and evaluated for tissue level and cellular level distribution by imaging, qPCR and single-cell RNA sequencing, simultaneously annotating cell origin and global transcriptional changes within the cell. Following systemic administration in mice, lipid conjugation improved overall multi organ efficacy compared to unconjugated ASO, but with pronounced tissue specific differences. Single cell sequencing of liver and heart transcriptomes revealed lipid dependent cellular uptake patterns and transcriptional responses distinct from administration of unconjugated ASO. After intracerebroventricular administration, selected fatty acid conjugates enhanced silencing in deep brain regions such as the striatum, whereas cholesterol conjugation impaired functional delivery despite increased CNS retention. Light-sheet microscopy showed restricted parenchymal penetration of cholesterol ASOs compared with broader but heterogeneous distribution of palmitic acid conjugate. Together, these findings demonstrate that lipid identity critically determines ASO efficacy, productive cellular uptake, and regional CNS engagement, emphasizing the need for context specific lipid design in ASO therapeutic development.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.08.28.747711", "scraped_at": "2026-09-05T21:30:59.134255+00:00", "spider_name": "biorxiv"}, {"doi": "10.64898/2026.06.12.731955", "title": "Hippocampal representations of possible futures predict motor output in the superior colliculus", "authors": "Wilhite, C.; Frank, L. M.; Scanziani, M.", "category": "neuroscience", "server": "biorxiv", "abstract": "The ability to represent possible futures allows animals to evaluate different options and act accordingly. The hippocampus can express representations of possible future paths, but the brain structures involved in transforming these representations into actions remain unknown. Here we show that hippocampal representations of possible future paths predict motor-related activity in the superior colliculus (SC), a midbrain structure involved in turning. By recording simultaneously from hippocampal neurons and from left- or right-preferring \"turn cells\" in the motor layers of the SC in navigating mice, we found that hippocampal representations of possible left or right future paths predicted increased firing rates of SC turn cells with matching left or right turn preference. This relationship was also evident in the animals' behavior: when the hippocampus represented future paths that were not ultimately taken, movement trajectories were nonetheless biased toward those paths, as if animals partially enacted possible futures that were represented but not selected. These results reveal a coordination between a cognitive and a motor structure and provide a potential pathway for mental simulations of possible futures to influence actions.", "pub_date": "2026-09-02", "published_doi": "", "source_url": "https://www.biorxiv.org/content/10.64898/2026.06.12.731955", "scraped_at": "2026-09-05T21:30:59.134988+00:00", "spider_name": "biorxiv"}], "rss": [{"title": "Metabolic engineering and deep learning-driven protein engineering for N-Acetylneuraminic acid biosynthesis in Escherichia coli", "link": "https://www.nature.com/articles/s41467-026-77406-2", "summary": "", "published": "2026-09-05T00:00:00+00:00", "source_feed": "Nature Biotechnology", "feed_url": "https://www.nature.com/subjects/biotechnology.rss", "category": "research", "scraped_at": "2026-09-05T21:31:13.295244+00:00", "spider_name": "rss"}, {"title": "Improvement of zein-soybean lipophilic protein complex Pickering emulsion gel by controlling ultrasonic power: focus on stability mechanism", "link": "https://www.nature.com/articles/s41538-026-01131-9", "summary": "", "published": "2026-09-05T00:00:00+00:00", "source_feed": "Nature Biotechnology", "feed_url": "https://www.nature.com/subjects/biotechnology.rss", "category": "research", "scraped_at": "2026-09-05T21:31:13.295244+00:00", "spider_name": "rss"}, {"title": "Structural characterization and in vitro anticancer activity of biogenic NiFe₂O₄ nanoparticles", "link": "https://www.nature.com/articles/s41598-026-69606-z", "summary": "", "published": "2026-09-05T00:00:00+00:00", "source_feed": "Nature Biotechnology", "feed_url": "https://www.nature.com/subjects/biotechnology.rss", "category": "research", "scraped_at": "2026-09-05T21:31:13.295244+00:00", "spider_name": "rss"}, {"title": "Application of CoQ10-loaded gSP-CS double-layer emulsion in milk: Impacts on quality and storage stability", "link": "https://www.nature.com/articles/s41538-026-01115-9", "summary": "", "published": "2026-09-05T00:00:00+00:00", "source_feed": "Nature Biotechnology", "feed_url": "https://www.nature.com/subjects/biotechnology.rss", "category": "research", "scraped_at": "2026-09-05T21:31:13.295244+00:00", "spider_name": "rss"}, const TABS = [
  {id:'clinicaltrials', icon:'🏥', label:'Clinical Trials', title:'Clinical Trials'},
  {id:'pubmed', icon:'🔬', label:'PubMed', title:'PubMed Articles'},
  {id:'biorxiv', icon:'📄', label:'bioRxiv', title:'Preprints'},
  {id:'rss', icon:'📰', label:'RSS News', title:'Industry News'},
];

let activeTab='clinicaltrials', searchQuery='';

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function stripHtml(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent||''}
function toggle(id){document.getElementById(id)?.classList.toggle('open')}

function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`
    <div class="nav-item ${activeTab===t.id?'active':''}" onclick="switchTab('${t.id}')">
      <span class="nav-icon">${t.icon}</span>${t.label}
      <span class="nav-count">${DATA[t.id].length}</span>
    </div>`).join('');
}

function renderStats(){
  document.getElementById('stats').innerHTML=TABS.map(t=>`
    <div class="stat ${activeTab===t.id?'active':''}" onclick="switchTab('${t.id}')">
      <div class="stat-icon">${t.icon}</div>
      <div class="stat-value">${DATA[t.id].length}</div>
      <div class="stat-label">${t.label}</div>
    </div>`).join('');
}

function switchTab(id){
  activeTab=id;
  const tab=TABS.find(t=>t.id===id);
  document.getElementById('page-title').textContent=tab?tab.title:id;
  renderNav();renderStats();renderResults();
}

function renderResults(){
  const el=document.getElementById('results');
  const emptyEl=document.getElementById('empty');
  const items=DATA[activeTab]||[];
  const q=searchQuery.toLowerCase();
  const filtered=items.filter(it=>!q||JSON.stringify(it).toLowerCase().includes(q));
  if(!filtered.length){el.innerHTML='';emptyEl.style.display='block';return}
  emptyEl.style.display='none';
  el.innerHTML=filtered.map((it,i)=>{
    if(activeTab==='clinicaltrials')return trialCard(it,i);
    if(activeTab==='pubmed')return pubmedCard(it,i);
    if(activeTab==='biorxiv')return biorxivCard(it,i);
    if(activeTab==='rss')return rssCard(it,i);
    return'';
  }).join('');
}

function phaseBadge(p){
  if(!p)return'';
  const c=p.includes('3')?'badge-green':p.includes('2')?'badge-amber':p.includes('1')?'badge-blue':'badge-purple';
  return`<span class="badge ${c}">${p}</span>`;
}
function statusBadge(s){
  if(!s)return'';
  const c=s==='RECRUITING'?'badge-green':s.includes('NOT_YET')?'badge-amber':'badge-cyan';
  return`<span class="badge ${c}">${s.replace(/_/g,' ')}</span>`;
}
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>';

function trialCard(t,i){
  const conds=(t.conditions||[]).join(', ');
  const intervs=(t.interventions||[]).map(v=>v.name).filter(Boolean).join(', ');
  return`<div class="card">
    <div class="card-head">
      <div class="card-head-content">
        <div class="card-title">${esc(t.title)}</div>
        <div class="card-badges">
          ${statusBadge(t.status)}${phaseBadge(t.phase)}
          <span class="badge badge-dim">${t.nct_id}</span>
          ${t.study_type?`<span class="badge badge-dim">${t.study_type}</span>`:''}
        </div>
      </div>
      <button class="expand-btn" onclick="toggle('c${i}')">Details</button>
    </div>
    <div id="c${i}" class="expandable"><div class="card-detail">
      ${conds?`<div class="field"><span class="field-label">Conditions: </span>${esc(conds)}</div>`:''}
      ${intervs?`<div class="field"><span class="field-label">Interventions: </span>${esc(intervs)}</div>`:''}
      <div class="field"><span class="field-label">Sponsor: </span>${esc(t.sponsor||'--')}</div>
      <div class="field"><span class="field-label">Enrollment: </span>${t.enrollment||'--'} participants</div>
      ${t.start_date?`<div class="field"><span class="field-label">Started: </span>${t.start_date}</div>`:''}
      ${t.summary?`<div style="margin-top:8px">${esc(t.summary).substring(0,500)}${(t.summary||'').length>500?'...':''}</div>`:''}
      <a class="card-link" href="${t.source_url}" target="_blank">View on ClinicalTrials.gov ${arrow}</a>
    </div></div>
  </div>`;
}

function pubmedCard(p,i){
  const auths=Array.isArray(p.authors)?p.authors.slice(0,3).join(', '):(p.authors||'');
  const more=Array.isArray(p.authors)&&p.authors.length>3?` +${p.authors.length-3} more`:'';
  const kw=(p.keywords||[]).slice(0,5);
  return`<div class="card">
    <div class="card-head">
      <div class="card-head-content">
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-meta">${esc(auths)}${more}${p.journal?' &middot; '+esc(p.journal):''}${p.pub_date?' &middot; '+p.pub_date:''}</div>
        ${kw.length?`<div class="card-badges" style="margin-top:6px">${kw.map(k=>`<span class="badge badge-dim">${esc(k)}</span>`).join('')}</div>`:''}
      </div>
      <button class="expand-btn" onclick="toggle('p${i}')">Details</button>
    </div>
    <div id="p${i}" class="expandable"><div class="card-detail">
      ${p.abstract?`<div>${esc(p.abstract).substring(0,600)}${(p.abstract||'').length>600?'...':''}</div>`:'<div style="font-style:italic;color:var(--text-dim)">No abstract available</div>'}
      ${p.doi?`<div class="field" style="margin-top:8px"><span class="field-label">DOI: </span>${esc(p.doi)}</div>`:''}
      <a class="card-link" href="${p.source_url}" target="_blank">View on PubMed ${arrow}</a>
    </div></div>
  </div>`;
}

function biorxivCard(b,i){
  return`<div class="card">
    <div class="card-head">
      <div class="card-head-content">
        <div class="card-title">${esc(b.title)}</div>
        <div class="card-badges" style="margin-top:6px">
          <span class="badge badge-blue">${b.category||'preprint'}</span>
          <span class="badge badge-dim">${b.pub_date||''} &middot; ${b.server||'biorxiv'}</span>
          ${b.published_doi?'<span class="badge badge-green">Peer-reviewed</span>':''}
        </div>
      </div>
      <button class="expand-btn" onclick="toggle('b${i}')">Details</button>
    </div>
    <div id="b${i}" class="expandable"><div class="card-detail">
      <div class="field"><span class="field-label">Authors: </span>${esc((b.authors||'').substring(0,200))}</div>
      ${b.abstract?`<div style="margin-top:8px">${esc(b.abstract).substring(0,500)}${(b.abstract||'').length>500?'...':''}</div>`:''}
      <a class="card-link" href="${b.source_url}" target="_blank">View on bioRxiv ${arrow}</a>
    </div></div>
  </div>`;
}

function rssCard(r){
  const summary=stripHtml(r.summary||'').substring(0,180);
  const date=r.published?new Date(r.published).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
  return`<div class="card">
    <div class="card-head">
      <div class="card-head-content">
        <div class="card-title">${esc(r.title)}</div>
        <div class="card-meta">
          <strong>${esc(r.source_feed||'')}</strong>
          ${date?' &middot; '+date:''}
          ${r.category?' &middot; '+esc(r.category.substring(0,50)):''}
        </div>
        ${summary?`<div style="margin-top:8px;font-size:12px;color:var(--text-secondary);line-height:1.6">${esc(summary)}</div>`:''}
      </div>
      <a class="card-link" href="${r.link}" target="_blank" style="white-space:nowrap">Read ${arrow}</a>
    </div>
  </div>`;
}

document.getElementById('search').addEventListener('input',e=>{searchQuery=e.target.value;renderResults()});
renderNav();renderStats();renderResults();
</script>
</body>
</html>
