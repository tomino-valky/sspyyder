l be randomized to receive placebo (56 in each study arm)."}], "primary_outcomes": ["Primary Objective", "Primary Endpoint", "Primary Endpoint", "Primary Endpoint"], "enrollment": 112, "sponsor": "Halia Therapeutics, Inc.", "collaborators": [], "start_date": "2026-05-12", "completion_date": "2028-07", "last_updated": "2026-08-05", "summary": "Primary Objectives: To demonstrate that HT-4253 improves the amyloid risk profile by transitioning biomarker-positive APOE4 carriers from a positive, high risk APS2 score to a negative, low risk APS2 score. Secondary Objectives: * To assess the effects of HT-4253 on tau related blood biomarker progression over the study period. * To assess the effects of HT-4253 on amyloid related blood biomarker progression over the study period. * To assess the safety and tolerability of HT-4253 in the UAE population.", "source_url": "https://clinicaltrials.gov/study/NCT07399171", "scraped_at": "2026-09-05T21:29:54.632792+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07221344", "title": "Study of ARO-MAPT-SC in Healthy Participants and Participants With Early Alzheimer's Disease", "official_title": "A Phase 1/2a Placebo-Controlled Dose-Escalating Study to Evaluate the Safety, Tolerability, Pharmacokinetics, and Pharmacodynamics of ARO-MAPT-SC in Healthy Subjects and Subjects With Early Alzheimer's Disease", "status": "RECRUITING", "phase": "PHASE1, PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease", "Alzheimer Disease, Early Onset"], "interventions": [{"type": "DRUG", "name": "ARO-MAPT-SC", "description": "• single or multiple doses of ARO-MAPT-SC by subcutaneous (SC) injection"}, {"type": "DRUG", "name": "Placebo", "description": "• calculated volume to match active treatment by SC administration"}], "primary_outcomes": ["Number of Participants with Treatment-Emergent Adverse Events (TEAEs) Over Time"], "enrollment": 112, "sponsor": "Arrowhead Pharmaceuticals", "collaborators": [], "start_date": "2025-11-18", "completion_date": "2027-06", "last_updated": "2026-06-23", "summary": "Study to evaluate the safety, tolerability, pharmacokinetics (PK), and pharmacodynamics of ARO-MAPT-SC compared to placebo in adult healthy volunteers and in participants with early Alzheimer's disease (AD), defined as mild cognitive impairment due to AD and mild AD dementia.", "source_url": "https://clinicaltrials.gov/study/NCT07221344", "scraped_at": "2026-09-05T21:29:54.632792+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06372587", "title": "Next-Generation alzheImer'S Therapeutics", "official_title": "Leveraging Genetically Encoded engiNeered protEins foR Next-Generation alzheImer'S Therapeutics", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease"], "interventions": [{"type": "OTHER", "name": "genetically encoded engineered proteins", "description": "using genetically encoded engineered proteins to obtain an inducible control of their activity in living human neurons promoting synaptic plasticity and/or preventing dendritic spines loss"}], "primary_outcomes": ["To use genetically encoded engineered proteins to obtain an inducible control of their activity in living human neurons preventing dendritic spines loss", "To leverage genetically encoded engineered proteins to prevent alterations in the morphology of dendritic spines in living human neurons", "To use genetically encoded engineered proteins to obtain an inducible control of their activity in living human neurons promoting functional synaptic plasticity", "To use genetically encoded engineered proteins to obtain evaluate neuronal excitability in living human neurons"], "enrollment": 14, "sponsor": "Fondazione Policlinico Universitario Agostino Gemelli IRCCS", "collaborators": [], "start_date": "2023-12-19", "completion_date": "2027-02-28", "last_updated": "2024-04-18", "summary": "Is this the right time to use next-generation approaches in Alzheimer's disease (AD)? In recent years, several large clinical trials testing treatments for AD have failed, putting the entire field on a reset. AD drug trials have almost exclusively sought to use antibodies targeted toward misfolded amyloid and tau proteins. Of note, although these approaches have failed, they were designed to cover both familial and sporadic forms of AD. On the other hand, the failure in developing new effective drugs is attributed to, but not limited to, the highly heterogeneous nature of AD with multiple underlying hypotheses and multifactorial pathology. The idea underlying this project is based on the assumption that learning and memory disorders can arise when the connections between neurons do not change appropriately in response to experience. Thus, by intervening on the core mechanisms of the cellular correlate of learning and memory, i.e., synaptic plasticity, the investigators expect to preserve some of the essential brain functions in AD. By overcoming the limits of traditional AD therapeutic approaches, the investigators will use genetically encoded engineered proteins (GEEPs), which the investigators developed and tested in vitro and in murine models, to control their activity in living human neurons boosting synaptic plasticity. Indeed, outstanding and relevant progress in understanding synaptic physiology empowers the possibility to prevent or limit brain disease like never before. The investigators designed GEEPs to address some of the leading causes of synaptic plasticity failures documented in AD. Thus, GEEPs will be tested in human induced pluripotent stem cells (hiPSCs)-derived living neurons obtained from reprogrammed peripheral tissues of participants with Alzheimer's diseases. hiPSCs will be obtained from fibroblast-derived from a skin biopsy of participants with AD and controls performed in local anesthesia using a 4 mm punch. The findings will provide the first preclinical study on the effect of genetically engineered proteins to control essential pathways implicated in synaptic plasticity on AD-related cognitive decline.", "source_url": "https://clinicaltrials.gov/study/NCT06372587", "scraped_at": "2026-09-05T21:29:54.633326+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07531732", "title": "Links Between Self-awareness and Sociocognitive Processes in Neurodegenerative Diseases", "official_title": "Study of the Links Between Self-awareness and Sociocognitive Processes in Neurodegenerative Diseases in People With Frontotemporal Lobar Degeneration, Behavioral Variant and Alzheimer's Disease", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Frontotemporal Dementia, Behavioral Variant", "Alzheimer Disease"], "interventions": [{"type": "BEHAVIORAL", "name": "Computer-based facial expression recognition task", "description": "Eighteen facial photographs from the FACES database (Ebner et al., 2010) were selected, each depicting one of six emotions: joy, sadness, disgust, fear, anger, and neutral. For each face, the patient must identify the emotion being expressed by choosing from six verbal labels displayed on the screen."}, {"type": "BEHAVIORAL", "name": "Computerized affective task", "description": "The task consists of 32 silent black-and-white videos featuring two characters interacting in a social situation, adapted from the Pierre and Marie task (Caillaud et al., 2020). Each video lasts between 8 and 9 seconds and shows one of the two characters experiencing a specific emotion. Patients will be asked to infer the emotion felt by that character. The emotions depicted are either positive or negative and vary in complexity: embarrassment, pride, anger, and surprise (8 videos for each emotion). After each video, the name of an emotion will appear on the screen, and patients will be asked to indicate whether the displayed emotion matches the one felt by the protagonist (half of the options will be congruent and the other half incongruent). The measured variable will be the rate of correct responses."}, {"type": "BEHAVIORAL", "name": "UCLA Structured Insight Interview", "description": "The UCLA Structured Insight Interview (Mendez \\& Shapira, 2011), translated into French, will be used to quantify anosognosia. This is a structured interview, conducted by the investigator, designed to assess patients' awareness of their symptoms in cases of neurodegenerative disease."}, {"type": "BEHAVIORAL", "name": "Barber's Standardized Suggestibility Scale", "description": "The participant, who must keep their eyes closed throughout the administration of the scale, receives a standardized series of suggestions read aloud by the experimenter in a specific order. These suggestions pertain to motor, sensory, verbal, and mnemonic responses (lowering or raising the arm, clenching the hands, feeling thirsty, speech inhibition, immobility, post-hypnotic response, and amnesia).The scale consists of 8 items and is therefore scored on a scale of 0 to 8 : minimum score 0/8 = no suggestibility; maximum score 8/8 = maximum suggestibility."}], "primary_outcomes": ["Metacognitive efficiency during facial emotion recognition (Mratio)"], "enrollment": 34, "sponsor": "Assistance Publique - Hôpitaux de Paris", "collaborators": ["Institut de psychologie", "Université Paris Cité", "Laboratoire Mémoire, Cerveau, Cognition"], "start_date": "2026-04", "completion_date": "2027-12", "last_updated": "2026-04-15", "summary": "This monocentric, non-interventional study (SELFSOC) investigates the relationship between self-awareness and social cognition in patients with behavioral variant frontotemporal dementia (bvFTD) and Alzheimer's disease (AD). The primary objective is to assess metacognitive efficiency related to social cognitive performance using a computerized facial emotion recognition task combined with confidence judgments. Metacognitive indices (including Mratio) will quantify the correspondence between subjective and objective performance. Thirty-four participants (17 bvFTD, 17 AD; age 50-80; MMSE ≥20) will complete two study visits involving tasks assessing emotion recognition, theory of mind, and memory.", "source_url": "https://clinicaltrials.gov/study/NCT07531732", "scraped_at": "2026-09-05T21:29:54.633326+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06029114", "title": "MR Elastography of Cognitive Impairment", "official_title": "Magnetic Resonance Elastography of Cognitive Impairment", "status": "ENROLLING_BY_INVITATION", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease", "Mild Cognitive Impairment", "Healthy"], "interventions": [{"type": "DIAGNOSTIC_TEST", "name": "Magnetic Resonance Elastography (MRE)", "description": "Imaging technique performed on a Compact 3T MRI scanner that measures the stiffness (mechanical properties) of tissues."}], "primary_outcomes": ["Shear Stiffness"], "enrollment": 450, "sponsor": "Mayo Clinic", "collaborators": ["National Institute on Aging (NIA)"], "start_date": "2023-10-11", "completion_date": "2027-11", "last_updated": "2026-01-13", "summary": "The purpose of this research is to further investigate the potential of brain stiffness as a novel biomarker for Alzheimer's disease.", "source_url": "https://clinicaltrials.gov/study/NCT06029114", "scraped_at": "2026-09-05T21:29:54.633326+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07762092", "title": "A Post Authorization Registry Study of Participants Treated With LEQEMBI", "official_title": "Post Authorization Registry Study of Patients Treated With LEQEMBI", "status": "NOT_YET_RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimers Disease"], "interventions": [{"type": "OTHER", "name": "No Intervention", "description": "No intervention."}], "primary_outcomes": ["Incidence and Severity of Known AEs"], "enrollment": 400, "sponsor": "Eisai Limited", "collaborators": [], "start_date": "2026-07-31", "completion_date": "2036-04-01", "last_updated": "2026-08-13", "summary": "To describe the incidence and severity of known adverse events, including amyloid-related imaging abnormalities-edema (ARIA-E), ARIA microhemorrhage and hemosiderin deposit (ARIA-H), and intracerebral hemorrhage greater than 1 cm in diameter in participants treated with LEQEMBI during routine clinical practice, summarizing the data overall and by apolipoprotein E4 variant (APOE4) genotype, concomitant antithrombotic therapy, and baseline magnetic resonance imaging (MRI) findings (comorbid cerebral amyloid angiopathy \\[CAA\\]). The secondary purpose of this study is, To describe progression to the next stage of Alzheimer's Disease (AD), stratified by ARIA and intracerebral hemorrhage greater than 1 cm. To describe previously unknown adverse events related to the long-term safety of LEQEMBI in routine clinical practice, which were not identified in clinical development, as assessed by serious suspected adverse reactions, adverse reactions leading to discontinuation of LEQEMBI treatment, and deaths that occur within 30 days of discontinuation of LEQEMBI treatment (regardless of causality). To describe drug utilization of LEQEMBI and to assess the effectiveness of risk minimization measures in routine clinical practice.", "source_url": "https://clinicaltrials.gov/study/NCT07762092", "scraped_at": "2026-09-05T21:29:54.633855+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07659964", "title": "Use of a Mobile Brain-Body Imaging Approach to Evaluate the Effects of Rhythmic Auditory Stimulation on Gait and Brain Function in Alzheimer's Disease", "official_title": "Use of a Mobile Brain-Body Imaging Approach to Evaluate the Effects of Rhythmic Auditory Stimulation on Gait and Brain Function in Alzheimer's Disease", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease (AD)", "Mild Cognitive Impairment (MCI)"], "interventions": [{"type": "OTHER", "name": "Metronome", "description": "Rhythmic Auditory stimulation"}], "primary_outcomes": ["Functional brain network connectivity", "Stride time variability", "Gait speed"], "enrollment": 40, "sponsor": "Boston University Charles River Campus", "collaborators": ["National Institute on Aging (NIA)"], "start_date": "2026-06-01", "completion_date": "2026-12", "last_updated": "2026-08-13", "summary": "Alzheimer's Disease (AD) is associated with impairments in both gait and cognition, significantly increasing fall risk. Falls are a leading cause of injury-related disability in older adults, and individuals with AD experience a nearly threefold higher rate of falls compared to neurotypical older adults. There is an urgent need for fall prevention interventions tailored to the unique deficits of individuals with AD. Converging evidence suggests that interventions aiming to reduce fall risk in AD should target both gait and cognition. Rhythmic music interventions, such as Rhythmic Auditory Stimulation (RAS) can harness global brain activation and auditory-motor entrainment to facilitate high-intensity exercise to alleviate AD-related neurocognitive and gait dysfunction. This study aims to assess the neural correlates of gait dysfunction in people with AD, evaluate if baseline neurocognitive impairment is predictive of the effects of RAS, and evaluate RAS benefits for individuals with AD.", "source_url": "https://clinicaltrials.gov/study/NCT07659964", "scraped_at": "2026-09-05T21:29:54.633855+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06023407", "title": "Feasibility of Improving Glycemia With Heat Therapy to Prevent AD", "official_title": "Feasibility of Improving Glycemia With Heat Therapy to Prevent AD", "status": "ENROLLING_BY_INVITATION", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Healthy Aging", "Alzheimer Disease", "Metabolic Disease"], "interventions": [{"type": "OTHER", "name": "Water Immersion Heat Therapy", "description": "10-weeks of 3 days per week in 1 of the 2 arms"}], "primary_outcomes": ["HbA1C", "Insulin sensitivity index"], "enrollment": 60, "sponsor": "University of Kansas Medical Center", "collaborators": ["National Institute on Aging (NIA)"], "start_date": "2024-02-27", "completion_date": "2028-03-31", "last_updated": "2026-04-17", "summary": "The investigators will determine if heat therapy can improve blood (Aim 1) and brain (Aim 2) glucose metabolism in cognitively healthy older adults (65+) who are at risk for AD. The investigators will also examine the degree to which changes in blood and brain glucose metabolism track together and explore several additional potential mechanisms that are critical to understanding the brain benefits of heat therapy (Aim 3). These aims will provide a comprehensive understanding of the impact of heat therapy on whole body metabolic function and brain health.", "source_url": "https://clinicaltrials.gov/study/NCT06023407", "scraped_at": "2026-09-05T21:29:54.633855+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT05508841", "title": "Understanding How Alzheimer's Disease Impacts the Therapeutic Response to Transcranial Direct Current Stimulation", "official_title": "Understanding How Alzheimer's Disease Impacts the Therapeutic Response to Transcranial Direct Current Stimulation", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease"], "interventions": [{"type": "OTHER", "name": "tDCS and Cognitive Training", "description": "Participants will receive mild stimulation or no stimulation along with cognitive training"}], "primary_outcomes": ["N-Back"], "enrollment": 42, "sponsor": "Baycrest", "collaborators": ["BrightFocus Foundation"], "start_date": "2022-09-01", "completion_date": "2026-12-31", "last_updated": "2024-08-13", "summary": "There is currently little symptomatic therapy for Alzheimer's Disease (AD) and nothing effective for individuals with Frontotemporal dementia (FTD). However, neuromodulation with transcranial direct current stimulation (tDCS) has the potential to be a clinically effective therapy for both AD and FTD. The challenge now is to specify the parameters and conditions under which tDCS is most effective to transition from the laboratory to clinical medicine. tDCS studies typically report significant group effects despite the variability demonstrated among participants, with some showing clear, meaningful improvement, while others only show statistical improvement or none at all. These variable results may be related to the conventional stimulation intensity level of 2mA. The investigators predict that administering tDCS at 4.0 mA, a more significant number of participants would show a meaningful response, and those who improve at 2mA may improve even more from 4.0mA due to having a larger electric field produced. The investigators aim to test this hypothesis in people with Alzheimer's Disease.", "source_url": "https://clinicaltrials.gov/study/NCT05508841", "scraped_at": "2026-09-05T21:29:54.633855+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT04114994", "title": "Longitudinal Cognitive Assessment by BoCA", "official_title": "Longitudinal Cognitive Assessment by BoCA", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease", "Mild Cognitive Impairment", "Vascular Dementia", "Frontotemporal Dementia", "Parkinson Disease", "Multiple Sclerosis", "TBI"], "interventions": [{"type": "DIAGNOSTIC_TEST", "name": "Boston Cognitive Assessment (BoCA)", "description": "The Boston Cognitive Assessment (BoCA) is a self-administered online test intended for longitudinal cognitive monitoring. BoCA uses random not-repeating tasks to minimize learning effects. BoCA was developed to evaluate the effects of treatment in longitudinal clinical trials and available gratis to individuals and professionals.\n\nBoCA includes eight subtests in the following domains: Memory/Immediate Recall, Memory/Delayed Recall, Executive function/ Visuospatial, Executive function/ Mental rotation, Attention, Mental math, Language/Prefrontal Synthesis, and Orientation. The maximum total score is 30. Higher score indicates better cognitive performance.\n\nAfter BoCA is completed, the domain scores and total score are provided immediately. Users will also receive an email with the link to the full report with progress charts."}], "primary_outcomes": ["Boston Cognitive Assessment (BoCA)"], "enrollment": 10000, "sponsor": "Alzheimer's Light LLC", "collaborators": [], "start_date": "2019-10-01", "completion_date": "2029-10-01", "last_updated": "2024-08-01", "summary": "The Boston Cognitive Assessment (BoCA) is a self-administered online test intended for longitudinal cognitive monitoring. BoCA uses random not-repeating tasks to minimize learning effects. BoCA was developed to evaluate the effects of treatment in longitudinal clinical trials and available gratis to individuals and professionals.", "source_url": "https://clinicaltrials.gov/study/NCT04114994", "scraped_at": "2026-09-05T21:29:54.633855+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT05785156", "title": "Diagnostic and Prognostic Value of New Quick Tests of Action Slowing in Stroke and in Cognitive Neurodegenerative Disease", "official_title": "Diagnostic and Prognostic Value of New Quick Tests of Action Slowing in Stroke and in Cognitive Neurodegenerative Disease", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Stroke", "Action Speed", "Dementia Mild Cognitive Impairment", "Alzheimer Disease"], "interventions": [{"type": "OTHER", "name": "quick tests", "description": "New quick tests are\n\n* Batterie MindPlus (Brevet n° FR1908081, Suarez 2019) is a quick reaction time battery and\n* Minimal Cognitive Evaluation (MCE) test (Sardi et al, 2019) is a cognitive screening tests including a specific assessment of slowing"}], "primary_outcomes": ["Value of the speed of the action with the 'RT Componential Analysis of Action Speed' battery in all patients"], "enrollment": 129, "sponsor": "Centre Hospitalier Universitaire, Amiens", "collaborators": [], "start_date": "2021-07-16", "completion_date": "2027-07-16", "last_updated": "2026-05-13", "summary": "A large series of recent studies have documented the frequency of the slowing of the action in brain diseases, especially vascular and neurodegenerative diseases. In stroke, the predictive value of action slowing at the acute phase for predicting post-stroke functional outcome remains poorly investigated. In neurodegenerative diseases, the diagnostic relevance of the slowing at the prodromal stage remains unknown and this diagnostic requires new tests. Finally, in terms of anatomical determinants, few studies have studied the determinants of action slowing. The objectives of this project are to Determine the diagnostic and prognostic value of action slowing assessed with new quick tests in patients with acute stroke (Neurovascular Unit) and cognitive neurodegenerative disorders (Alzheimer Disease (AD), Lewy Body disease (LBD), Fronto Temporal lobar degeneration (FTLD), Cortico Basal Degeneration (CBD) and Progressive Supra Nuclear Palsy (PSNP)) and to define the lesion determinants with VBM and VLSM", "source_url": "https://clinicaltrials.gov/study/NCT05785156", "scraped_at": "2026-09-05T21:29:54.634370+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07521722", "title": "DIV-AD BARCELONA: Alzheimer's Blood-Based Biomakers for a Diverse Community", "official_title": "DIV-AD BARCELONA: Alzheimer's Blood-Based Biomakers for a Diverse Community", "status": "NOT_YET_RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease", "Cognitive Dysfunction, Cognitive Disorder", "Dementia", "Neurodegenerative Disease"], "interventions": [], "primary_outcomes": ["Plasma levels of Alzheimer's disease blood-based biomarkers across ethnic groups"], "enrollment": 250, "sponsor": "Barcelonabeta Brain Research Center, Pasqual Maragall Foundation", "collaborators": ["Universitat Pompeu Fabra", "Hospital del Mar Research Institute (IMIM)", "Fundacio d'Investigacio en Atencio Primaria Jordi Gol i Gurina", "Hospital del Mar"], "start_date": "2026-04-27", "completion_date": "2029-01-01", "last_updated": "2026-04-13", "summary": "The DIV-AD study aims to find out whether levels of Alzheimer's disease markers in blood differ among the main ethnical groups living in central Barcelona. It will also examine how factors such as age, income, education, and health conditions may affect these levels. In addition, the study will identify barriers that may make it difficult to use these blood tests in primary care. The final goal is to help ensure that everyone in Barcelona has fair access to early prevention strategies for Alzheimer's disease.", "source_url": "https://clinicaltrials.gov/study/NCT07521722", "scraped_at": "2026-09-05T21:29:54.634370+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07222280", "title": "Clinical Trial Protocol: Alzheimer's Dementia Underlying Encephalopathy", "official_title": "Clinical Trial Protocol: Alzheimer's Dementia Underlying Encephalopathy", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Dementia", "Alzheimer Disease", "Delirium Confusional State", "Encephalopathy", "Cognitive Abnormality"], "interventions": [{"type": "DIAGNOSTIC_TEST", "name": "Quest AD-Detect blood test", "description": "Blood will be collected and sent for testing using the Quest AD-Detect blood test"}], "primary_outcomes": ["To show the percentage of patients (21 patients in the study) who presented with a cognitive diagnosis (including but not limited to delirium, encephalopathy, etc.) that have a positive biomarker for Alzheimer's dementia"], "enrollment": 30, "sponsor": "Covenant Health, US", "collaborators": [], "start_date": "2025-06-10", "completion_date": "2026-03-31", "last_updated": "2025-10-29", "summary": "The goal of this clinical trial is to determine if utilizing the Quest AD-Detect blood test, while patient's are hospitalized for a cognitive diagnosis (such as delirium or encephalopathy), will result in an earlier diagnosis of underlying Alzheimer's disease. * Will this blood test have the ability to distinguish between Alzheimer's disease and other causes of cognitive impairment in the inpatient setting? * Neurology Clinic will complete a 6-month post-hospitalization follow up with patients who have had the Quest AD-Detect Alzheimer's Disease blood test completed while they were inpatient to discuss the risk assessment portfolio", "source_url": "https://clinicaltrials.gov/study/NCT07222280", "scraped_at": "2026-09-05T21:29:54.634370+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07511868", "title": "Digital Application for Stroke Health", "official_title": "Evaluating a Digital Health Application for Post-stroke Care and Vascular Risk Factor Management - a Multicenter Randomized Controlled Clinical Investigation", "status": "NOT_YET_RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Haemorrhagic Stroke", "Ischaemic Stroke", "Transient Ischemic Attack (TIA)"], "interventions": [{"type": "DEVICE", "name": "StrokeApp", "description": "StrokeApp is a smartphone/tablet-based medical application designed to support patients following ischemic stroke, hemorrhagic stroke, or transient ischemic attack (TIA). The application is installed on the patient's personal device during hospitalization and includes structured onboarding. It provides educational content on stroke and secondary prevention, medication and appointment reminders, and tools for documenting health-related parameters. Patients complete electronic patient-reported outcomes (ePROs) at predefined time points. Optional daily tracking features and automated feedback support adherence to treatment recommendations and promote health-related behavior change. The application is used for up to 12 months in addition to standard care."}, {"type": "OTHER", "name": "Standard care", "description": "Standard post-stroke care according to clinical guidelines, including routine inpatient management and structured outpatient follow-up approximately three months after discharge. No digital application is provided."}], "primary_outcomes": ["Health-related quality of life (EQ VAS)"], "enrollment": 500, "sponsor": "VASCage GmbH", "collaborators": ["Medical University Innsbruck", "Evaluation Software Development (ESD)"], "start_date": "2026-04-01", "completion_date": "2026-12-31", "last_updated": "2026-04-06", "summary": "Stroke is a leading cause of death and long-term disability worldwide. Despite substantial advances in acute stroke care, there remains a lack of evidence-based digital solutions to support patients after hospital discharge. This study evaluates the effectiveness of a digital health application (StrokeApp) designed to support patients with ischemic or hemorrhagic stroke or transient ischemic attack (TIA) in secondary prevention and recovery. In this multicenter, randomized, controlled, open-label trial, 500 patients will be assigned in a 1:1 ratio to receive either standard care alone or standard care in combination with StrokeApp. The primary objective is to assess the impact of the application on health-related quality of life three months after discharge. Secondary and exploratory outcomes include health literacy, medication adherence, vascular risk factors, health-related behaviors, psychosocial outcomes, long-term recovery up to twelve months, as well as safety and user experience.", "source_url": "https://clinicaltrials.gov/study/NCT07511868", "scraped_at": "2026-09-05T21:29:54.634370+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT04335994", "title": "ENhancing Outcomes in Cognitive Impairment Through Use of Home Sleep ApNea Testing", "official_title": "ENhancing Outcomes in Cognitive Impairment Through Use of Home Sleep ApNea Testing: A Randomized Controlled Trial (ENCHANT Study)", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Obstructive Sleep Apnea", "Alzheimer Disease", "Vascular Dementia", "Mild Cognitive Impairment", "Parkinsons Disease With Dementia", "Dementia With Lewy Bodies", "Mixed Dementia"], "interventions": [{"type": "DEVICE", "name": "In-laboratory polysomnography", "description": "Level 1 in-laboratory polysomnography for the detection of obstructive sleep apnea."}, {"type": "DEVICE", "name": "Home Sleep Apnea Test", "description": "Use of a home sleep apnea test that records respiratory effort, pulse, oxygen saturation and nasal flow, and reports apneas, hypopneas, flow limitation, snoring and blood oxygen saturation in order to detect obstructive sleep apnea."}], "primary_outcomes": ["Proportion of patients who complete sleep testing"], "enrollment": 200, "sponsor": "Sunnybrook Health Sciences Centre", "collaborators": ["Unity Health Toronto"], "start_date": "2019-09-23", "completion_date": "2027-06", "last_updated": "2026-08-20", "summary": "Obstructive sleep apnea (OSA), which causes abnormal pauses in breathing during sleep, is common in patients with vascular cognitive impairment (VCI) and Alzheimer's disease (AD), and exacerbates the cognitive deficits seen in these conditions. OSA is typically treated with continuous positive airway pressure (CPAP), which has been shown to improve cognition in VCI and slow cognitive decline in AD. Despite the need to identify OSA in patients with VCI/AD, these patients often do not undergo testing for OSA. One major barrier is that in-laboratory polysomnography (iPSG), the current standard for diagnosing OSA, is inconvenient for patients with VCI/AD who may be reliant on others for care or require familiar sleep environments. A convenient and cheaper alternative to iPSG is home sleep apnea testing (HSAT), which has been validated against iPSG to diagnose OSA and has proven feasible for use in VCI/AD. Our primary objective is to determine whether the use of HSAT is superior to iPSG in terms of the proportion of patients who complete sleep testing by 6 months post-randomization. We will also investigate cost-effectiveness, patient satisfaction, proportion of patients treated with CPAP, changes in cognition, mood, sleep-related and functional outcomes between HSAT and iPSG at 6 months.", "source_url": "https://clinicaltrials.gov/study/NCT04335994", "scraped_at": "2026-09-05T21:29:54.634370+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07051239", "title": "Sleep Stimulation to Enhance Waste Clearance in the Brain", "official_title": "Enhancing Waste Clearance Through Sleep Stimulation", "status": "NOT_YET_RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Healthy", "Subjective Cognitive Decline (SCD)", "Mild Cognitive Impairment (MCI)", "Alzheimer Disease (AD)"], "interventions": [{"type": "OTHER", "name": "Closed-loop acoustic stimulation", "description": "At-home sleep will be monitored using an EEG headband. Non-awakening auditory stimuli will be delivered during non-rapid eye movement sleep (NREM), timed to the ascending phase of slow waves, using either active or control (sham) conditions."}], "primary_outcomes": ["Plasma biomarkers"], "enrollment": 105, "sponsor": "Erasme University Hospital", "collaborators": ["University of Amsterdam"], "start_date": "2025-09", "completion_date": "2028-09", "last_updated": "2025-07-09", "summary": "This study aims to examine whether multi-night closed-loop auditory stimulation (CLAS) during sleep can enhance waste clearance and memory consolidation in healthy adults and older adults with subjective cognitive decline or mild cognitive impairment who exhibit elevated brain amyloid levels identified through prior clinical screening. Specifically, the study investigates whether sleep stimulation increases the clearance of plasma biomarkers related to neurodegeneration, improves the brain's waste clearance system, and supports memory consolidation. Participants will undergo five nights each of CLAS and sham (no stimulation) interventions, with a washout period in between. They will also complete clinical assessments, including MRI scans, blood sample collection, and cognitive testing, and will keep track of subjective sleep quality, sleepiness, mood, and fatigue throughout the interventions.", "source_url": "https://clinicaltrials.gov/study/NCT07051239", "scraped_at": "2026-09-05T21:29:54.634370+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07340983", "title": "Effectiveness of the Safe Haven Application (App) Among Undergraduates", "official_title": "The Effectiveness of the Safe Haven APP on Mental Health Among Undergraduates: A Randomized Controlled Trial", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Depression", "Anxiety"], "interventions": [{"type": "BEHAVIORAL", "name": "Safe Haven App", "description": "A Just-in-Time Adaptive Intervention (JITAI) mobile app that integrates self-monitoring, risk stratification, and tailored psychoeducation modules. The system provides real-time feedback and stepped-care support based on the user's psychological status."}], "primary_outcomes": ["Depression, Anxiety, and Stress Symptoms (DASS-21)", "General Psychological Distress (CHQ-12)", "Mental Health Literacy (MHLS-HPG)"], "enrollment": 68, "sponsor": "National Cheng-Kung University Hospital", "collaborators": [], "start_date": "2025-09-16", "completion_date": "2027-01-31", "last_updated": "2026-01-21", "summary": "The goal of this randomized controlled trial is to evaluate the effectiveness of the Safe Haven app in reducing mental health symptoms and enhancing mental health literacy in undergraduates at a national university in southern Taiwan. The main questions it aims to answer are: Does the Safe Haven app lead to significantly greater reductions in general psychological distress, depression, anxiety, and stress compared to standard campus care? Does the app result in greater improvements in mental health literacy among participants? Researchers will compare an experimental group (receiving the Safe Haven app in addition to standard campus care) to a waitlist control group (receiving standard campus care only) to see if the intervention provides superior improvements in mental health outcomes over time. Participants will: Complete online assessments at three time points: baseline (T0), post-intervention (3 months, T1), and follow-up (3 months post-intervention, T2). Experimental Group: Download the Safe Haven app to complete daily mood self-monitoring and weekly assessments, and receive psychoeducational content, personalized suggestions for 3 months. Control Group: Maintain access to standard campus care and receive access to the app after the final follow-up assessment.", "source_url": "https://clinicaltrials.gov/study/NCT07340983", "scraped_at": "2026-09-05T21:29:54.634370+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06467539", "title": "Novel Augmentation of DAOIB and Antioxidant for Early Dementia", "official_title": "Novel Augmentation of DAOIB and Antioxidant for Early Dementia", "status": "RECRUITING", "phase": "PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease", "Mild Cognitive Impairment"], "interventions": [{"type": "DRUG", "name": "DAOIB plus AO", "description": "oral, for 24 weeks"}, {"type": "DRUG", "name": "DAOIB plus placebo", "description": "oral, for 24 weeks"}], "primary_outcomes": ["Change from baseline in the Alzheimer's disease assessment scale - cognitive subscale at week 8, 16 and 24"], "enrollment": 80, "sponsor": "Chang Gung Memorial Hospital", "collaborators": [], "start_date": "2024-06-19", "completion_date": "2027-05", "last_updated": "2026-03-19", "summary": "Previous studies found that some NMDA-enhancing agents were able to improve cognitive function of patients with early-phase dementia. In addition, several drugs with antioxidant properties have been tested in clinical trials for the treatment of dementia too. Whether combined treatment of an NMDA-enhancing agent and a drug with antioxidant property can be better than an NMDA-enhancing agent alone deserves study.", "source_url": "https://clinicaltrials.gov/study/NCT06467539", "scraped_at": "2026-09-05T21:29:54.634990+00:00", "spider_name": "clinicaltrials"}], "pubmed": [{"pmid": "42697973", "title": "ASIC currents in cultured primate retinal rod and cone cells.", "authors": ["Saafir Talib", "Leng Tiandong", "Inoue Koichi", "Xiong Zhi-Gang", "MacLeish Peter"], "journal": "Pflugers Archiv : European journal of physiology", "pub_date": "2026-09-05", "doi": "10.1007/s00424-026-03207-7", "abstract": "Acid Sensing Ion Channels (ASICs) are widely expressed in the nervous system and involved in an increasing number of functions such as nociception, mechanoreception, and taste transduction, to name a few. In the CNS, ASICs are involved in synaptic plasticity, learning/memory, and in acidosis-mediated neuronal injury. In retina, ASICs are expressed in rodent, rabbit and monkey retina and pharmacological and gene knockdown studies have indicated changes in the earliest phases of electroretinogram that point to effects on phototransduction. This finding led us to investigate the electrophysiological/pharmacological properties of ASICs in cultured primate rod and cone cells. Patch-clamp recordings showed transient ASIC currents with a threshold pH of ~ 7.0 and pH0.5 of 6.15 ± 0.03 and 6.33 ± 0.03 for cultured rod and cone cells, respectively. The currents were almost completely blocked by amiloride and highly sensitive to PcTx-1. Our results for the first time demonstrate the expression of functional ASICs on primate photoreceptors and suggest that ASIC currents in these cells are mediated predominantly by homomeric ASIC1a channels.", "keywords": ["Animals", "Acid Sensing Ion Channels", "Retinal Cone Photoreceptor Cells", "Retinal Rod Photoreceptor Cells", "Cells, Cultured"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42697973/", "scraped_at": "2026-09-05T21:30:48.973346+00:00", "spider_name": "pubmed"}, {"pmid": "42697957", "title": "Neuromodulation for restoring and amplifying brain function.", "authors": ["Grover Shrey", "Wen Wen", "Reinhart Robert M G"], "journal": "Nature neuroscience", "pub_date": "2026-09-04", "doi": "10.1038/s41593-026-02434-6", "abstract": "Neuromodulation aims to improve brain function by altering neural activity. While many rehabilitation strategies seek to restore normal, healthy-like dynamics, some adopt a complementary strategy, using neuromodulation to strengthen repurposed processes that support function. Here we formalize these approaches as 'restorative normalization' (RN) and 'compensatory amplification' (CA), respectively. Drawing on cognitive neurophysiology, we evaluate the following four factors that enable CA to be effective: multiple realizability, multiscale neuroplasticity, precision readiness and activity selectivity. We analyze the interplay between RN and CA across clinical goals, such as stroke rehabilitation, and identify opportunities in neurodegeneration, psychiatry and aging where CA could delay decline, facilitate remission or increase neural processing capacity. We propose that positioning CA alongside RN as a core design principle can sharpen target selection, guide stratified treatments and translate known compensatory signatures into testable neuromodulation protocols.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42697957/", "scraped_at": "2026-09-05T21:30:48.973346+00:00", "spider_name": "pubmed"}, {"pmid": "42697900", "title": "YTHDF1 modulates CAP1-mediated actin turnover to regulate synaptic function and anxiodepressive-like behaviors.", "authors": ["Zhou Xidan", "Li Si", "Guo Chen", "Wu Songfen", "Wu Xiaoli", "Wu Min", "Wu Cuiting", "Li Kuan", "Cui Yihui", "Zhou Tao"], "journal": "Molecular psychiatry", "pub_date": "2026-09-04", "doi": "10.1038/s41380-026-03840-9", "abstract": "Neuroplasticity and synaptic dysfunction are central to the pathophysiology of depression, yet their underlying mechanisms remain not fully understood. Here, we identify the m6A reader protein YTHDF1 as a key regulator of depression pathogenesis. Mice with genetic deletion of Ythdf1 exhibited anterior cingulate cortex (ACC) hyperactivity, hyperalgesia, heightened social stress sensitivity, and anxiodepressive-like behaviors following acute social stress. Using multi-omics approaches, we linked these effects to dysregulated actin cytoskeleton dynamics and identified cyclase-associated protein 1 (CAP1) as a downstream effector of YTHDF1. YTHDF1 deficiency reduced CAP1 expression from early postnatal stages, leading to F-actin accumulation, impaired synaptic function, and behavioral deficits. Strikingly, early postnatal re-expression of YTHDF1 in the ACC normalized CAP1 levels, restored synaptic integrity, and reversed depressive-like phenotypes. Similarly, CAP1 re-expression was sufficient to alleviate stress-induced psychomotor retardation and anxiety. Our findings establish the YTHDF1-CAP1 axis as a critical pathway governing synaptic function and depressive behaviors.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42697900/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42697629", "title": "Bilingual education and cognitive control: An educational neuroscience perspective.", "authors": ["Fujitani Hiroo"], "journal": "Trends in neuroscience and education", "pub_date": "2026-08-17", "doi": "10.1016/j.tine.2026.100297", "abstract": "Bilingual education provides a natural framework for studying how experience shapes the developing and aging brain. Managing two languages engages neural networks supporting executive function and cognitive control, offering a model of experience-dependent plasticity. This narrative review synthesizes developmental, neuroimaging, electrophysiological, and longitudinal studies published primarily between 2010 and 2025, with earlier seminal studies included to provide theoretical context. The review is based on English-language literature identified through major international databases and is not a systematic review. Bilingual experience induces structural and functional changes in frontoparietal and frontostriatal networks, improves white matter integrity, and enhances neural efficiency in cognitive control tasks. ERP and longitudinal studies indicate benefits for attention, working memory, and metalinguistic awareness. In older adults, lifelong bilingualism supports executive function and cognitive resilience, contributing to cognitive reserve. Behavioral effects are inconsistent, but neural adaptations are robust. Bilingual education illustrates how socially embedded, cognitively demanding learning shapes brain networks. It provides a valuable model for understanding experience-dependent neuroplasticity across the lifespan, with implications for education and cognitive health in aging.", "keywords": ["Humans", "Multilingualism", "Cognition", "Executive Function", "Neuronal Plasticity", "Brain", "Neurosciences", "Aging"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42697629/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42697356", "title": "Neurofunctional gradients and molecular signatures underlying problematic smartphone use: A connectomic, psychological, and transcriptomic study.", "authors": ["Li Hanbing", "Li Zixi", "Li Wei", "Kan Quanyu", "Xie Yuxin", "Hu Ying", "Zhou Yu", "Abudukadier Adili", "Wang Qiang"], "journal": "Progress in neuro-psychopharmacology & biological psychiatry", "pub_date": "2026-09-04", "doi": "10.1016/j.pnpbp.2026.111916", "abstract": "Problematic smartphone use (PSU) is an emerging behavioral concern linked to impaired cognitive control and heightened social sensitivity, with fear of missing out (FoMO) increasingly recognized as a core psychological driver. However, the neurobiological mechanisms underlying PSU remain unclear. In this study, we investigated the neural architecture of PSU by integrating functional connectome gradient mapping, psychological mediation, and transcriptomic annotation. PSU severity was associated with altered principal gradients of functional connectivity, including increased connectivity gradients in the frontal pole and angular gyrus, and decreased connectivity gradients in the superior parietal lobule. Inter-subject representational similarity analyses further revealed that PSU-related gradient alterations were distributed across the default mode, frontoparietal, dorsal and ventral attention, sensorimotor, and visual networks. Mediation analyses demonstrated that FoMO significantly mediated the association between gradient 1 alterations in the bilateral superior parietal lobule and PSU severity. Transcriptomic analysis identified 1273 genes spatially aligned with the neural gradients, enriched for synaptic and glial functions, with distinct developmental expression profiles. Notably, hub genes such as BDNF, SYN1, and MRPS11 pointed to neuroplasticity and developmental mechanisms. Together, these findings provide a multilevel framework for understanding PSU, bridging neural gradients, molecular architecture, and psychological vulnerability.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42697356/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42696589", "title": "Learning induces activation-mechanism-dependent neural plasticity in an intracortical microstimulation task.", "authors": ["Kim Robin", "Lycke Roy", "Zolotavin Pavlo", "Montes Jon", "Xie Chong", "Luan Lan"], "journal": "Science advances", "pub_date": "2026-09-04", "doi": "10.1126/sciadv.aef0343", "abstract": "Electrical microstimulation provides high-resolution control of neural circuits for causal studies and restoration of impaired functions, yet how responses to artificial activation evolve with learning remains unclear. Here, we deploy a detection task and pair ultraflexible electrodes for stable intracortical microstimulation (ICMS) with longitudinal imaging and recordings to track single-cell and population responses across weeks of learning. Detection thresholds decreased with learning, indicating plasticity. Chronic imaging showed that stimulus-evoked recruitment expanded at a fixed current, while a consistent number of neurons continued to underlie behavioral responses. A subset of learning-sensitive cells enhanced modulation and reduced latency. Electrophysiological recordings further distinguished two forms of adaptation: Directly activated, pulse-locked neurons strengthened their excitability, whereas polysynaptically recruited neurons expanded in number and were predictive of behavioral outcomes. These results show that learning in an ICMS task reshapes cortical circuits through activation-mechanism-dependent plasticity, underscoring the need for stimulation paradigms that adapt to both cell-intrinsic and network dynamics.", "keywords": ["Animals", "Neuronal Plasticity", "Electric Stimulation", "Learning", "Neurons", "Male"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42696589/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42696515", "title": "Neuromodulatory mechanisms and therapeutic effects of repetitive transcranial magnetic stimulation (rTMS) in multiple sclerosis: A systematic review and exploratory meta-analysis.", "authors": ["Siddharth R G Veda", "Phakey Nisha", "Godara Karishma", "Mahesh Karthik Vinay"], "journal": "Applied neuropsychology. Adult", "pub_date": "2026-09-04", "doi": "10.1080/23279095.2026.2727513", "abstract": "Noninvasive neuromodulatory interventions, particularly repetitive Transcranial Magnetic Stimulation (rTMS) and intermittent Theta Burst Stimulation (iTBS), are increasingly emerging as alternative and complementary approaches for symptomatic management of Multiple Sclerosis (MS). This systematic review and exploratory meta-analysis synthesized evidence from 11 Randomized Controlled Trials (RCTs) evaluating the clinical efficacy and underlying mechanisms of rTMS. Across individual trials, directionally consistent short-term improvements were observed in spasticity, fatigue, balance, gait, dexterity, and cerebellar functions. Exploratory Meta-analytic results indicated a reduction in spasticity, as well as modest improvements in fatigue and depressive symptoms. Neuroimaging findings further suggested microstructural changes consistent with altered white matter properties. Potential mechanisms include modulation of cortical excitability, synaptic plasticity, interhemispheric balance, and neuroimmune processes. Despite these promising directional trends, small sample sizes, variability in stimulation protocols, and limited geographic representation limit the broader generalizability and robustness of these findings. Overall, rTMS appears generally well tolerated in small trials, with short-term symptomatic improvements reported in some domains. These preliminary findings highlight the need for longitudinal trials employing standardized stimulation protocols and multimodal outcome assessments to elucidate sustained efficacy and underlying mechanisms.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42696515/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42696458", "title": "Resveratrol in depression: mechanistic networks, preclinical evidence and translational perspectives.", "authors": ["Chen Cong", "He Peiyi", "Liu Yang", "Ma Jiahui", "Zhai Haiying", "Yu Rong"], "journal": "The world journal of biological psychiatry : the official journal of the World Federation of Societies of Biological Psychiatry", "pub_date": "2026-09-04", "doi": "10.1080/15622975.2026.2724504", "abstract": "Depression involves interacting immune, oxidative, metabolic, neuroendocrine and neuroplasticity networks. This review evaluates mechanistic, preclinical, human and translational evidence for resveratrol in depression. We conducted a structured narrative review of English-language literature to 30 June 2026 using PubMed, Web of Science Core Collection, Scopus and ScienceDirect, supplemented by Google Scholar and citation searching. After duplicate removal, 4,461 records were screened, 142 full texts assessed and 71 publications included. Antidepressant-like effects were reported across stress, endocrine, developmental, post-stroke, metabolic and gut-inflammatory models, involving SIRT1/AMPK, NF-κB/ NLRP3, Nrf2/HO-1, mitochondrial and ferroptosis pathways,monoaminergic and cAMP/PKA/CREB/BDNF signalling, and gut brain communication. However, many studies used preventive or concurrent dosing, male animals, high doses or non-oral routes. Human studies were few, heterogeneous and mainly non psychiatric, and do not establish efficacy for major depressive disorder. Nanoformulations may improve exposure, but depression specific clinical validation is lacking. Current evidence does not support resveratrol as monotherapy or an established depression treatment. It is better positioned as a mechanistic probe and hypothesis-generating adjunctive candidate. Future studies should prioritise therapeutic designs, pharmacokinetic monitoring, standardised outcomes and adequately powered adjunctive trials.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42696458/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42696151", "title": "Differential effects of acute, chronic, and social defeat stress on microglial morphology in the basolateral and central amygdala, and the medial and lateral habenula.", "authors": ["Nieto-Quero A", "Munoz-Martin J", "Infantes-López M I", "Tabbai S", "Arjona A", "Zambrana-Infantes E", "Chaves-Peña P", "Blanca M J", "Pérez-Martín M", "Pedraza C"], "journal": "Brain structure & function", "pub_date": "2026-09-04", "doi": "10.1007/s00429-026-03172-y", "abstract": "Effective stress regulation is essential for emotional health, whereas maladaptive stress responses contribute to neuropsychiatric disorders such as depression and post-traumatic stress disorder. Because neuron-microglia interactions are increasingly recognized as key modulators of neuroplasticity under physiological conditions, stress-related microglial dysregulation may contribute to aberrant neuronal responses implicated in mental health disorders. This exploratory study examined region-specific microglial morphometric responses to acute intense stress, chronic restraint stress, and social defeat stress (SDS) in the amygdala and habenula, focusing on the BLA, CeA, LHb, and MHb. Microglial morphology was assessed using animal-level morphometric comparisons and exploratory cluster-based profiling. Acute stress was associated with limited animal-level morphometric differences, while exploratory cluster distributions suggested subregion-dependent shifts, particularly in the CeA and LHb. Chronic stress was associated with larger soma-related parameters in the BLA and CeA, together with a descriptive redistribution toward large-soma/low-process profiles in both amygdalar subregions. In the habenula, chronic stress induced selective MHb morphometric changes, while cluster profiles remained comparatively constrained. SDS was associated with the most pronounced remodelling in the amygdala, including increased soma-related measures, reduced circularity/solidity in the CeA, altered spatial organization, and a strong redistribution toward large-soma/ high-process profile. SDS also shifted LHb cluster profiles, whereas the MHb showed comparatively limited sensitivity. Overall, these exploratory findings suggest that different stressors are associated with region- and subregion-dependent microglial remodelling, with the amygdala showing greater stress-related plasticity than the habenula. These patterns support further investigation of microglial morphological adaptation as a potential contributor to stress-related psychopathology.", "keywords": ["Animals", "Microglia", "Stress, Psychological", "Habenula", "Male", "Social Defeat", "Central Amygdaloid Nucleus", "Amygdala", "Chronic Disease", "Rats, Sprague-Dawley", "Basolateral Nuclear Complex", "Rats"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42696151/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42696146", "title": "Nutritional regulation of gut-brain immune crosstalk across the lifespan.", "authors": ["Zhou Yulin", "Del Toro Sebastian", "Zeng Melody Y"], "journal": "Gut microbes", "pub_date": "2026-09-04", "doi": "10.1080/19490976.2026.2725371", "abstract": "The gut-brain immune axis integrates microbial, immune, and neural signals to regulate neurodevelopment, homeostasis, and disease susceptibility. Early-life nutrition, particularly human milk oligosaccharides, shapes beneficial microbiota composition, enhances hippocampal plasticity, promotes anti-inflammatory microglia polarization, and fosters immune tolerance. Gut microbiota-derived metabolites, including short-chain fatty acids, tryptophan derivatives and secondary bile acids, regulate microglia maturation, astrocyte function, T cell differentiation, neurotransmitter production, and vagus nerve signaling. These processes influence synaptic pruning, neurogenesis, and neuroinflammation. Adaptive immune cells in the central nervous system, notably meningeal and infiltrating CD4 T cells, further connect peripheral immunity to neuronal responses through cytokines, such as IL-4, IFNγ, and IL-17A. Nutritional imbalances may exacerbate disease-associated microglia and pathogenic T cell activity in Multiple Sclerosis, Alzheimer's disease, and autism spectrum disorders. In aging, diet helps mitigate \"inflammaging\" by countering metabolic shifts in microglia and lymphocytes. This review examines how nutrition modulates bidirectional gut-brain immune crosstalk across the lifespan.", "keywords": ["Humans", "Brain", "Animals", "Gastrointestinal Microbiome", "Aging", "Gastrointestinal Tract", "Brain-Gut Axis"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42696146/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42696144", "title": "Neuroimmune pharmacotherapy across the skin-brain axis: mechanisms, therapeutic targets, and AI-enabled precision approaches.", "authors": ["Habib Yasser H", "Mansy Bahaaeldin M", "Ali Mennatallah A"], "journal": "Naunyn-Schmiedeberg's archives of pharmacology", "pub_date": "2026-09-04", "doi": "10.1007/s00210-026-05859-9", "abstract": "The skin-brain axis is a bidirectional neuroimmune network linking cutaneous inflammation with central neuroinflammation, stress signaling, and behavioral disturbances. This review summarizes the mechanisms underlying skin-brain communication and evaluates current and emerging pharmacological strategies targeting this axis in inflammatory skin disorders. We synthesized contemporary experimental, translational, and clinical evidence on neuroimmune signaling across the skin-brain axis, with emphasis on sensory neuron-immune cell interactions, neurogenic inflammation, glial activation, pharmacological targets, biomarkers, disease models, and artificial intelligence (AI)-enabled precision approaches. Current evidence suggests that chronic cutaneous inflammation may promote central neuroimmune activation through neuropeptides, cytokines, and stress-responsive pathways. Central stress signaling can, in turn, exacerbate skin disease. Substance P, calcitonin gene-related peptide, transient receptor potential channels, microglia, and astrocytes emerge as key mediators linking peripheral inflammation to altered neuroplasticity and affective symptoms. Therapeutic approaches including biologics, Janus kinase and phosphodiesterase-4 inhibitors, neuromodulators, and transient receptor potential antagonists show promise in reducing pruritus and neuropsychiatric comorbidity. However, pharmacodynamic variability and incomplete response remain important limitations. Biomarkers, multi-omic profiling, and advanced preclinical models may improve translational evaluation, while AI tools may support biomarker discovery, digital phenotyping, and individualized treatment selection. The skin-brain axis represents a pharmacologically actionable framework for inflammatory skin disease. Integrated strategies addressing peripheral inflammation, central neuroimmune dysregulation, and psychosocial burden may improve precision pharmacotherapy and clinical outcomes.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42696144/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42696131", "title": "Neurodevelopmental reward dysregulation and addiction risk in ADHD.", "authors": ["Custodio Raly James Perez", "Yi Eugene C", "Kim Bung-Nyun", "Cheong Jae Hoon"], "journal": "European archives of psychiatry and clinical neuroscience", "pub_date": "2026-09-04", "doi": "10.1007/s00406-026-02370-3", "abstract": "Attention-deficit/hyperactivity disorder (ADHD) is associated with an elevated risk of substance use disorders (SUDs), yet most affected individuals do not develop addiction, indicating that vulnerability is selectively distributed rather than intrinsic to the disorder itself. This Review synthesizes current evidence on the neurodevelopmental mechanisms linking ADHD to SUD vulnerability, examines reward-related dysregulation as a unifying mechanistic framework underlying this association, and proposes a subgroup-based precision psychiatry perspective to explain the heterogeneity of addiction risk among individuals with ADHD. Integrating evidence across genetics, molecular neuroscience, neurodevelopment, systems-level circuitry, computational modeling, and environmental modulation, converging findings implicate polygenic variation affecting synaptic and dopaminergic pathways that interacts with atypical maturation of frontostriatal and frontocortical systems supporting reward valuation, inhibitory control, and salience processing. These multilayered perturbations may manifest computationally as dysregulated reinforcement learning, including altered dopamine signaling dynamics and impaired integration of delayed outcomes, biasing decision-making toward immediate reward. At the circuit level, disrupted coordination between mesolimbic reward systems and prefrontal control networks may facilitate a shift from goal-directed behavior to habit-based responding following repeated substance exposure, further shaped by experience-dependent neuroplasticity. Importantly, available evidence suggests that addiction risk is concentrated within distinct ADHD subgroups characterized by reduced responsiveness to anticipated rewards, impaired reinforcement learning, preference for immediate over delayed rewards, impaired inhibitory control, emotional dysregulation, and impulsive decision-making that emerge and evolve across development. Collectively, this synthesis supports a precision psychiatry framework integrating genetic, neuroimaging, computational, and digital phenotyping approaches to improve the identification, prediction, and prevention of SUD vulnerability in ADHD.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42696131/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42695554", "title": "Examining dynamic changes in prefrontal connectivity and internalizing symptoms during the first and third trimesters of pregnancy.", "authors": ["Thomas Emily B K", "Williams Micah A", "Breheny Patrick", "Miskolczi Abigél", "Demir-Lira Ö Ece"], "journal": "Journal of neuroendocrinology", "pub_date": "2026-01-01", "doi": "10.1111/jne.70252", "abstract": "Pregnancy is characterized by pronounced neuroplasticity and heightened risk for psychopathology. While previous research has primarily examined postpartum depression, less work has investigated changes in internalizing symptoms measured dimensionally across the peripartum period. Furthermore, limited research has identified functional changes in the prefrontal cortex (PFC) across pregnancy, a brain area implicated in psychopathology. Understanding the dynamic changes in internalizing symptoms and PFC neuroconnectivity throughout pregnancy and their interrelations is crucial for early identification of perinatal psychopathology. This pre-registered longitudinal study examined changes in and associations between internalizing symptoms and PFC functional connectivity throughout the first and third trimesters of pregnancy. Pregnant individuals recruited from a community sample of females engaged in prenatal care (N = 60, Mage = 32.31, SD = 5.34, 90% White, 91.7% non-Hispanic/Latine) completed structured clinical interviews assessing mood and anxiety symptoms and resting-state functional near-infrared spectroscopy measuring PFC connectivity during the first and third trimesters of pregnancy. From the first to third trimester, longitudinal results revealed a significant decrease in symptoms of distress and fear and significant increases in neuroconnectivity anchored in left medial frontal areas of the PFC. Cross-sectionally, higher first trimester fear was associated with lower within-region right medial PFC and higher within-region left medial PFC connectivity. Longitudinal decreases in distress from first to third trimester were associated with increased connectivity between left medial and right lateral PFC, alongside weakened connectivity between bilateral medial frontal regions. These findings demonstrate that internalizing symptoms relate to prefrontal connectivity from first to third trimester in a community sample of pregnant women. Examining internalizing symptoms dimensionally across pregnancy allows for characterization of the full range of symptoms that impact pregnant individuals. Future research should explore prevention and intervention implications of the relations between neural profiles and internalizing symptoms during pregnancy to improve long-term outcomes for the mother and child.", "keywords": ["Humans", "Female", "Pregnancy", "Prefrontal Cortex", "Pregnancy Trimester, Third", "Longitudinal Studies", "Adult", "Pregnancy Trimester, First", "Anxiety", "Neural Pathways", "Spectroscopy, Near-Infrared", "Depression"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42695554/", "scraped_at": "2026-09-05T21:30:48.974345+00:00", "spider_name": "pubmed"}, {"pmid": "42695508", "title": "Environmental Enrichment as a Preclinical Framework for Understanding Art Therapy: Hypothalamic-pituitary-adrenal Axis and Neuroplasticity Mechanisms.", "authors": ["Kim Hak-Jae", "Lee Jeong-Beom", "Park Jong In"], "journal": "Journal of physiological investigation", "pub_date": "2026-09-04", "doi": "10.4103/ejpi.EJPI-D-26-00011", "abstract": "", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42695508/", "scraped_at": "2026-09-05T21:30:48.975347+00:00", "spider_name": "pubmed"}, {"pmid": "42695497", "title": "Metal Ions in Longgu (Fossilized Bone) as a Natural Synergistic Network for Multi-Target Therapy in Psychiatric Disorders.", "authors": ["Xiujia Sun", "Hua Li Zhan", "Yuanze Gao", "Jing Liu", "Li Li", "Chao Zhang", "Ganesan Kumar", "Chen Jianping"], "journal": "Chemistry & biodiversity", "pub_date": "2026-01-01", "doi": "10.1002/cbdv.71623", "abstract": "Longgu (fossilized bone), a mineral medicine in traditional Chinese medicine, has been used for centuries to treat symptoms resembling modern anxiety and insomnia. This review evaluates the hypothesis that Longgu's therapeutic effects arise from a synergistic network of its constituent metal ions. We synthesized evidence from chemical analyses, pharmacological studies of Ca, Mg, Zn, Fe, Cu, and Mn, and clinical trials of Longgu-containing formulations. The metal ions form an integrated network exhibiting three emergent properties. First, ionostatic balance is achieved through Ca/Mg-mediated regulation of neuronal excitability. Second, cross-pathway synergy occurs where zinc concurrently modulates neurotransmission and promotes neuroplasticity via BDNF. Third, systemic integration involves zinc and manganese co-regulating the gut-brain axis. Clinical studies demonstrate that Longgu-containing formulations improve outcomes in depression, anxiety, and insomnia, particularly for comorbid conditions, and show synergistic effects when combined with conventional antidepressants. This network pharmacology framework repositions Longgu as a model for developing multi-target therapeutics, offering a strategy to overcome limitations of single-target psychiatric drugs.", "keywords": ["Humans", "Mental Disorders", "Animals", "Metals", "Ions", "Medicine, Chinese Traditional"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42695497/", "scraped_at": "2026-09-05T21:30:48.975347+00:00", "spider_name": "pubmed"}, {"pmid": "42695253", "title": "High-Definition Transcranial Direct Current Stimulation (HD-tDCS) Enhances Cognitive Recovery After Traumatic Brain Injury Through Synaptic PlasticityRelated Changes.", "authors": ["Guo Zijia", "Bai Nan", "Xin Wenxuan", "Xiang Maosheng", "Geng Yuanming", "Xie Weiyi", "Ma Chiyuan"], "journal": "Journal of integrative neuroscience", "pub_date": "2026-01-26", "doi": "10.31083/JIN52353", "abstract": "Traumatic brain injury (TBI) often leads to long-term cognitive deficits. High-definition transcranial direct current stimulation (HD-tDCS) is a non-invasive neuromodulation approach with potential to enhance cognitive recovery. However, the underlying mechanisms by which tDCS influences neural synapses following mild TBI remain unclear. In this study, we aimed to identify the optimal HD-tDCS intervention cycle for improving cognition after repetitive mild TBI (rmTBI) in mice and to elucidate synaptic mechanisms. Male C57BL/6J mice underwent mild closed-head injury and received HD-tDCS (0.5 mA, 20 min/day) over the right parietal cortex. Cognitive performance was evaluated after 5, 10, and 15 days of stimulation using Y-maze and novel object recognition tests. Synaptic protein expression (PSD-95, SYN, NMDAR, GluA1) and BDNF/TrkB/CREB signaling pathway components were assessed via Western blot, while c-Fos expression was examined by immunofluorescence staining. Dendritic spine density was examined using Golgi staining. In addition, exploratory molecular modeling was performed to assess potential interactions between electric fields and the BDNF-TrkB complex. Separately, to contextualize our experimental findings, we also analyzed the public single-cell RNA-sequencing dataset GSE180862 as part of the study design. HD-tDCS improved learning and memory performance, with the 15-day protocol showing the most robust effects among the tested schedules at the same post-injury endpoint. Behavioral improvements were accompanied by increased expression of BDNF-associated signaling proteins, elevated synaptic marker levels, and enhanced dendritic spine density in the hippocampus. In the 15-day stimulation group, a numerical trend toward sustained cognitive benefit was observed at 2 weeks after the end of stimulation, although the difference did not reach statistical significance. Molecular modeling suggested potential field-protein interactions but did not establish direct conformational modulation in vivo. Cognitive recovery improved following HD-tDCS intervention, accompanied by upregulation of BDNF/TrkB/CREB pathway-related proteins, synaptic markers, and dendritic spine density. These findings suggest a close association between repeated HD-tDCS and plasticity-related molecular changes after brain injury, although causal evidence for pathway activation requires further investigation.", "keywords": ["Animals", "Transcranial Direct Current Stimulation", "Neuronal Plasticity", "Male", "Brain Injuries, Traumatic", "Mice, Inbred C57BL", "Mice", "Recovery of Function", "Cognitive Enhancement", "Cognitive Dysfunction", "Disease Models, Animal", "Parietal Lobe", "Behavior, Animal"], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42695253/", "scraped_at": "2026-09-05T21:30:48.975347+00:00", "spider_name": "pubmed"}, {"pmid": "42695012", "title": "Genomic insights into stroke recovery: cross-phenotype associations.", "authors": ["Aldridge Chad", "Braun Robynne", "Parodi Livia", "Lohse Keith", "Edwardson Matthew A", "Cole John W", "Lindgren Arne G", "Hsu Fang-Chi", "Keene Keith", "Worrall Bradford", "Rosand Jonathan", "Holman E Alison", "Cramer Steven C"], "journal": "Brain communications", "pub_date": "2026-08-26", "doi": "10.1093/braincomms/fcag322", "abstract": "Stroke is a major cause of long-term disability with variable recovery. While clinical factors such as initial severity play a role, genetic factors are increasingly recognized as important contributors to stroke recovery. Genotype studies are generally focused on a single post-stroke behavioural domain, but some genes might relate to broad mechanisms of plasticity. This study therefore aimed to identify cross-phenotypic genetic variants associated across two or more stroke recovery domains. DNA from Stroke, Stress, Rehabilitation, and Genetics study participants was genotyped, resulting in 9 814 610 variants. In order to examine cross-phenotypic results, we first conducted genome-wide association studies on the six recovery domains: motor (grip force), cognition (Telephone Montreal Cognitive Assessment), depression (Patient Health Questionnaire-8), stress (Primary Care Post-Traumatic Stress Disorder Screen), functional status (Stroke Impact Scale-Activities of Daily Living), and disability (modified Rankin Scale 0-2 versus 3-6), some of which were tested longitudinally, yielding nine phenotypes. Models were adjusted for age, sex, initial severity (NIH Stroke Scale score), and ancestry. Cross-phenotype associations were identified by evaluating single nucleotide polymorphisms (SNPs) associated (P < 5e-5) with multiple phenotypes. To determine how these genetic variants may relate to biological mechanisms of recovery, we conducted gene enrichment analyses. Participants (n = 565, 59% male) had mild-moderate initial stroke severity (median acute NIH Stroke Scale score = 4). After accounting for the correlation structure among the nine phenotypes, we observed 319 cross-phenotypic SNPs, 3.45 times the expected number. Five of the cross-phenotypic SNPs were linked to genes relevant to neural development, function and plasticity, e.g. ERICH1 (rs11778883-C), FOX3 (rs55726768-G), LIFR-AS1 (rs76401391-T), RPS6KA2 (rs113518460-C) and TUBGCP2 (rs147150392-C), as were enrichments in RAB5-EEA1, CTNNA1-CTNNB1, CIN85-SH3GL2 and ELMO1-DOCK2 complexes. Multiple gene enrichments were found, e.g. Stroke Impact Scale-Activities of Daily Living and Patient Health Questionnaire 8 at 3 months were enriched for CREB phosphorylation, which is important for long-term potentiation. We identified cross-phenotypic SNPs associated with multiple behavioural domains of stroke recovery. Some of these genes encode, or regulate, druggable proteins. These genetic factors are not well captured by clinical or neuroimaging assessments and so provide a unique window into stroke recovery. These findings, if validated, suggest that some genes may be broadly important to stroke recovery.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42695012/", "scraped_at": "2026-09-05T21:30:48.975347+00:00", "spider_name": "pubmed"}, {"pmid": "42694864", "title": "Association Between Kynurenine Pathway and Cerebellar Microstructure in Bipolar Disorder With Childhood Trauma.", "authors": ["Yin Ming", "Zhang Huifeng", "Pei Huibin", "Zhou Rubai", "Lu Wenxian", "Wu Baichuan", "Xu Tenghuan", "Wu Ye", "Du Xiangdong", "Peng Daihui"], "journal": "Alpha psychiatry", "pub_date": "2026-08-13", "doi": "10.31083/AP52059", "abstract": "Childhood trauma (CT) has been recognized as a risk factor contributing to clinical heterogeneity and adverse outcomes in bipolar disorder (BD). The neurobiological mechanisms linking CT and BD, particularly those involving the kynurenine pathway (KP) and cerebellar neuroplasticity, remain unclear. A total of 51 BD patients with CT (BD+CT), 47 BD patients without CT (BD+NCT), and 50 healthy controls (HCs) were recruited. Peripheral KP metabolites were measured, and a biophysical neurite orientation dispersion and density imaging (NODDI) model was performed to evaluate microstructural alterations in cerebellar gray matter. Mediation analysis was conducted to examine whether these biomarkers mediate the association between CT and clinical phenotypes in BD. In the BD+CT group, picolinic acid (PIC) levels were significantly lower, and the gray matter orientation dispersion index (ODI) in left cerebellar lobule VIIB was significantly higher, compared to other groups. PIC levels positively correlated with age of onset but negatively with emotional neglect and sexual abuse, anxiety and somatization, and left lobule VIIB ODI. Additionally, left lobule VIIB ODI showed a positive correlation with anxiety and somatization. Exploratory path modeling indicated that sexual abuse was indirectly associated with greater anxiety/somatization severity via reduced PIC levels and increased left lobule VIIB ODI. In BD, CT exposure was associated with reduced PIC levels, altered gray matter microstructure in left cerebellar lobule VIIB, and more severe anxiety/somatization. These findings offer insights into mechanisms for BD with CT, though the exploratory path model could not adjust for medication and requires replication in medication-naïve samples.", "keywords": [], "source_url": "https://pubmed.ncbi.nlm.nih.gov/42694864/", "scraped_at": "2026-09-05T21:30:48.975347+00:00", "spider_name": "pubmed"}, {"pmid": "42694671", "title": "Closed-loop brain-computer interfaces for post-stroke sensorimotor loop restoration.", "authors": ["Tao Ran", "Duan Can", "Zhang Yang-Pu"], "journal": "Frontiers in neuroscience", "pub_date": "2026-08-20", "doi": "10.3389/fnins.2026.1882653", "abstract": "Stroke recovery is increasingly understood as a process shaped by disrupted interactions among motor intention, descending motor output, peripheral movement, and sensory feedback, rather than by motor weakness alone. After stroke, residual motor intention may not be effectively translated into spinal motor output, peripheral movement may be too limited to provide sufficient sensory feedback, and compensatory network recruitment may not always support efficient motor control. Closed-loop brain-computer interfaces offer a mechanistically motivated approach to this problem by detecting motor imagery, motor attempt, or sensorimotor rhythms in real time and translating these signals into contingent functional electrical stimulation, robotic assistance, virtual reality, multisensory feedback, or neuromodulation. By partially restoring the temporal coupling between detected motor intention, assisted or stimulated movement, and sensory feedback, these systems are hypothesized to promote activity-dependent plasticity, reinforce sensorimotor circuits, and modulate distributed motor, sensory, attentional, and interhemispheric networks. In this review, we synthesize the neurobiological basis, recovery mechanisms, implementation strategies, and emerging predictive biomarkers of closed-loop brain-computer interfaces for post-stroke sensorimotor rehabilitation. Although closed-loop brain-computer interfaces show promise for selected patients, treatment effects remain heterogeneous and depend on patient characteristics, decodability of motor-related brain signals, intervention dose, feedback modality, and trial design. Future progress will require mechanism-informed pa
