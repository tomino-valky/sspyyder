<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pavuk - Neurobiology Research Monitor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-deep:#060a14;
  --bg-surface:rgba(12,18,32,0.85);
  --bg-card:rgba(15,25,50,0.55);
  --bg-card-hover:rgba(20,35,70,0.65);
  --bg-glass:rgba(20,30,60,0.4);
  --border:rgba(100,160,255,0.1);
  --border-glow:rgba(100,160,255,0.25);
  --glow:rgba(80,140,255,0.06);
  --glow-strong:rgba(80,140,255,0.12);
  --text:#e2e8f0;
  --text-secondary:#94a3b8;
  --text-dim:#4b5c78;
  --primary:#5b9aff;
  --primary-soft:rgba(91,154,255,0.15);
  --cyan:#22d3ee;
  --cyan-soft:rgba(34,211,238,0.12);
  --green:#34d399;
  --green-soft:rgba(52,211,153,0.12);
  --amber:#fbbf24;
  --amber-soft:rgba(251,191,36,0.12);
  --red:#f87171;
  --purple:#a78bfa;
  --purple-soft:rgba(167,139,250,0.12);
  --sidebar-w:230px;
}

html{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg-deep);
  color:var(--text);
  min-height:100vh;
  display:flex;
  overflow-x:hidden;
  line-height:1.5;
}

/* ---- Animated background ---- */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 800px 600px at 15% 20%, rgba(50,100,200,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 600px 500px at 85% 75%, rgba(30,80,180,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 400px 400px at 50% 50%, rgba(60,120,220,0.03) 0%, transparent 70%);
}

/* ---- Sidebar ---- */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;
  width:var(--sidebar-w);
  background:var(--bg-surface);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  z-index:100;
  padding:0;
}
.sidebar-brand{
  padding:28px 24px 20px;
  border-bottom:1px solid var(--border);
}
.sidebar-logo{
  display:flex;align-items:center;gap:12px;
}
.sidebar-logo svg{width:36px;height:36px;opacity:0.9}
.sidebar-logo h1{
  font-size:20px;font-weight:700;letter-spacing:1.5px;
  background:linear-gradient(135deg,var(--primary),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.sidebar-subtitle{font-size:10px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:6px}

.sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:10px;
  font-size:13px;font-weight:500;color:var(--text-secondary);
  cursor:pointer;transition:all 0.2s;border:1px solid transparent;
  position:relative;
}
.nav-item:hover{color:var(--text);background:var(--glow)}
.nav-item.active{
  color:var(--text);
  background:var(--primary-soft);
  border-color:rgba(91,154,255,0.15);
}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;
  background:var(--primary);
}
.nav-item .nav-icon{width:18px;text-align:center;font-size:15px}
.nav-item .nav-count{
  margin-left:auto;font-size:11px;font-weight:600;
  background:var(--bg-card);padding:2px 8px;border-radius:6px;
  color:var(--text-dim);
}
.nav-item.active .nav-count{color:var(--primary);background:var(--primary-soft)}

.sidebar-footer{
  padding:16px 20px;border-top:1px solid var(--border);
  font-size:10px;color:var(--text-dim);line-height:1.6;
}

/* ---- Main ---- */
.main{
  margin-left:var(--sidebar-w);flex:1;min-height:100vh;
  position:relative;z-index:1;
}
.main-inner{max-width:880px;margin:0 auto;padding:32px 36px}

/* ---- Header ---- */
.header{margin-bottom:28px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.header h2{font-size:22px;font-weight:700}
.header .timestamp{font-size:11px;color:var(--text-dim)}

.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-dim)}
.search-input{
  width:100%;padding:11px 16px 11px 40px;
  background:var(--bg-card);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:13px;font-family:inherit;
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.search-input::placeholder{color:var(--text-dim)}
.search-input:focus{border-color:var(--border-glow);box-shadow:0 0 20px var(--glow)}

/* ---- Stats ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat{
  background:var(--bg-card);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:14px;
  padding:18px 16px;
  cursor:pointer;transition:all 0.25s;
  position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;inset:0;border-radius:14px;
  background:radial-gradient(ellipse at 50% 0%, var(--glow) 0%, transparent 70%);
  opacity:0;transition:opacity 0.3s;
}
.stat:hover::before,.stat.active::before{opacity:1}
.stat:hover,.stat.active{border-color:var(--border-glow)}
.stat-icon{font-size:20px;margin-bottom:8px;position:relative;z-index:1}
.stat-value{font-size:28px;font-weight:700;position:relative;z-index:1;letter-spacing:-0.5px}
.stat-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px;position:relative;z-index:1}

/* ---- Cards ---- */
.card-list{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--bg-card);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;
  transition:all 0.25s;
  position:relative;
}
.card:hover{
  border-color:var(--border-glow);
  background:var(--bg-card-hover);
  box-shadow:0 4px 24px var(--glow);
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-head-content{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:600;line-height:1.45;color:var(--text)}
.card-meta{font-size:12px;color:var(--text-secondary);margin-top:5px}
.card-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.badge{
  display:inline-flex;align-items:center;
  padding:3px 10px;border-radius:8px;
  font-size:10px;font-weight:600;letter-spacing:0.3px;
}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-blue{background:var(--primary-soft);color:var(--primary)}
.badge-cyan{background:var(--cyan-soft);color:var(--cyan)}
.badge-purple{background:var(--purple-soft);color:var(--purple)}
.badge-dim{background:rgba(255,255,255,0.04);color:var(--text-dim);font-weight:500}

.expand-btn{
  background:none;border:none;color:var(--primary);font-size:12px;font-weight:500;
  cursor:pointer;padding:4px 8px;border-radius:6px;
  transition:background 0.15s;white-space:nowrap;font-family:inherit;
}
.expand-btn:hover{background:var(--primary-soft)}

.expandable{max-height:0;overflow:hidden;transition:max-height 0.35s ease}
.expandable.open{max-height:4000px}
.card-detail{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text-secondary);line-height:1.7;
}
.card-detail .field{margin-bottom:6px}
.card-detail .field-label{font-weight:600;color:var(--text)}
.card-link{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--primary);text-decoration:none;font-size:12px;font-weight:500;
  margin-top:8px;padding:4px 0;transition:color 0.15s;
}
.card-link:hover{color:var(--cyan)}
.card-link svg{width:12px;height:12px}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-dim);
  font-size:14px;
}

/* ---- Responsive ---- */
@media(max-width:900px){
  :root{--sidebar-w:0px}
  .sidebar{display:none}
  .main-inner{padding:20px 16px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

oss 3 consecutive daily sessions to probe neural circuit integrity. This specific HD-tDCS device is completely computer driven, running on a laptop using specialized software. Circular electrodes (12-mm in diameter) filled with conductive gel will be placed in a 4x1 ring configuration with the central electrode being the anode surrounded by four cathodes."}], "primary_outcomes": ["Changes in Rey Auditory Verbal Learning Test Score"], "enrollment": 75, "sponsor": "University of Texas Southwestern Medical Center", "collaborators": [], "start_date": "2023-04-20", "completion_date": "2027-05-31", "last_updated": "2026-07-20", "summary": "This study will probe if the biological changes in amnestic mild cognitive impairment (aMCI) are related to a history of mild traumatic brain injury (mTBI) using high definition transcranial direct current stimulation (HD-tDCS) and blood-derived biomarker tools. Participants who Do as well as those who Do Not have a history of mTBI will be enrolled in the study.", "source_url": "https://clinicaltrials.gov/study/NCT05446584", "scraped_at": "2026-09-05T21:29:54.629441+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT03851523", "title": "Longitudinal Study for the Characterization of the Phases of Subjective Perception of Cognitive Decline and Mild Cognitive Impairment of Alzheimer's Disease.", "official_title": "AlfaCognition: Longitudinal Study for the Characterization of the Phases of Subjective Perception of Cognitive Decline and Mild Cognitive Impairment of Alzheimer's Disease.", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease", "Mild Cognitive Impairment", "Subjective Cognitive Decline"], "interventions": [{"type": "OTHER", "name": "No intervention", "description": "No intervention"}], "primary_outcomes": ["Subjective Cognitive Decline Questionnaire (my-Cog)", "Subjective Cognitive Decline Questionnaire (their-Cog)"], "enrollment": 400, "sponsor": "Barcelonabeta Brain Rese venting the development of dementia. For this reason, a detailed characterization of the successive clinical and biological changes that lead to the dementia stage is of vital importance in identifying the persons who could benefit from a possible preventive strategy, as well as the optimal moment to carry out the intervention. The the scientific community, is convinced that intervention aiming to prevent the clinical development of AD dementia must be implemented several years before the first symptoms arise. In this context, the present project is developed under the hypothesis that subjective cognitive decline (SCD) in individuals with a performance in cognitive tests within normality represents the first symptomatic manifestation of AD. In persons with SCD, the presence of a higher intensity of subjective complaint quantified using a specific subjective complaint questionnaire (SCD-Q) will be associated with lower cognitive performance and a higher rate of conversion to MCI and/or dementia. The relationship between the perception of cognitive decline by the subject and his/her relative will differently vary depending on the stage of the disease: in subjects with progressive cognitive impairment, the subjective perception of cognitive decline will decrease with disease progression whereas the perception of decline will increase with disease progression in their relatives. The degree of perception of cognitive decline throughout the different phases of the disease will be correlated with cognitive and affective patterns as well as with changes in AD biomarkers. These changes will be related to specific brain patterns and abnormal levels of AD biomarkers, which on the other hand will also be present in patients with MCI and mild dementia due to AD. The present study has two main objectives that are: 1. To characterize from a cognitive and biomarker (when available) point of view persons with SCD and to study its association with the risk of presenting a progressive cognitive deterioration. 2. To study the evolution of the subjective perception of cognitive impairment by the participants and their relatives and to analyze its impact in cognitive, affective and functional terms along the clinical-biological continuum of AD.", "source_url": "https://clinicaltrials.gov/study/NCT03851523", "scraped_at": "2026-09-05T21:29:54.629441+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07265323", "title": "Effect of Physiologic Insulin Administration on Insulin Sensitivity and Cognition", "official_title": "Effect of Physiologic Insulin Intervention on Insulin Sensitivity and Cognition", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer s Disease", "Alzheimer Blood Biomarkers", "Insulin Sensitivity"], "interventions": [{"type": "OTHER", "name": "Physiological Insulin Intervention", "description": "Insulin infusion every five minutes over approximately two hours for six months. Initially infusion will be weekly and then frequency will reduce based on participants' response."}], "primary_outcomes": ["Cognition", "Cognition", "Insulin Sensitivity"], "enrollment": 8, "sponsor": "Pennington Biomedical Research Center", "collaborators": [], "start_date": "2025-12", "completion_date": "2027-05", "last_updated": "2025-12-04", "summary": "The goal of this clinical trial is to determine if a weekly delivery of insulin at short intervals lasting up to 2 hours can improve insulin sensitivity and cognition in adults with Alzheimer's Disease. It will also provide information about the safety and feasibility of this intervention. The main questions it aims to answer are: Does the intervention improve insulin sensitivity (how the body uses glucose)? Does the intervention improve cognition, measured by the Montreal Cognitive Assessment (MoCA) and the Revised Memory and Behavior Problems Checklist (RMBPC)? What changes occur in brain glucose uptake (FDG-PET)? Participants will: Receive the intervention once a week for 6 months, with each session lasting up to 2 hours Complete cognitive assessments. Adverse events will be assessed throughout the study.", "source_url": "https://clinicaltrials.gov/study/NCT07265323", "scraped_at": "2026-09-05T21:29:54.630442+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07279740", "title": "Combined Brain Stimulation and Methylphenidate Treatment for Apathy in Dementia", "official_title": "Methylphenidate Primed iTBS for Apathy in Neurocognitive Disorders", "status": "RECRUITING", "phase": "PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer s Disease", "Alzheimer Dementia (AD)", "Alzheimer Dementia", "Alzheimer Disease", "Apathy", "Apathy in Dementia"], "interventions": [{"type": "DEVICE", "name": "intermittent theta burst stimulation (iTBS)", "description": "iTBS is a form of repetitive transcranial magnetic simulation (rTMS), a non-invasive form of brain stimulation."}, {"type": "DRUG", "name": "Methylphenidate (MPH)", "description": "Participants will be on methylphenidate clinically prior to the trial"}], "primary_outcomes": ["Change in Neuropsychiatric Inventory-Apathy (NPI-A) score"], "enrollment": 12, "sponsor": "Sunnybrook Health Sciences Centre", "collaborators": ["Alzheimer Society of Canada", "Sunnybrook Research Institute", "Brain Canada"], "start_date": "2026-01", "completion_date": "2027-10-01", "last_updated": "2025-12-12", "summary": "This study evaluates whether the combined treatment of methylphenidate and non-invasive brain stimulation, called intermittent theta burst stimulation, can effectively treat apathy in individuals with Alzheimer's disease or mixed AD/vascular dementia", "source_url": "https://clinicaltrials.gov/study/NCT07279740", "scraped_at": "2026-09-05T21:29:54.630442+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07314190", "title": "Retrospective Observational Study of Blood-based Biomarkers in the Diagnosis and Monitoring of Patients With a Neurodegenerative Disease or Mental Disorder", "official_title": "Synapsing Retrospective Biomarker Study", "status": "ENROLLING_BY_INVITATION", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease", "Dementia With Lewy Bodies (DLB)", "Frontotemporal Dementia (FTD)", "Major Depressive Disorder (MDD)", "Bipolar 1 Disorder", "Schizophenia Disorder", "Parkinson Disease"], "interventions": [], "primary_outcomes": ["Concentration of biomarkers in blood", "Diagnosis", "Boston Naming Test"], "enrollment": 1799, "sponsor": "Fundació Institut de Recerca de l'Hospital de la Santa Creu i Sant Pau", "collaborators": ["University of Ulm", "University Of Perugia", "University of Eastern Finland"], "start_date": "2026-02-19", "completion_date": "2029-12-31", "last_updated": "2026-02-23", "summary": "This is a retrospective observational study to evaluate the clinical utility of blood-based biomarkers in the diagnosis and management of patients with a neurodegenerative disease (ND) or mental disorder (MD).", "source_url": "https://clinicaltrials.gov/study/NCT07314190", "scraped_at": "2026-09-05T21:29:54.630442+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06023446", "title": "Can (Optical Coherence Tomography) Pictures of the Retina Detect Alzheimer's Disease at Its Earliest Stages?", "official_title": "Illuminating Glial Dysfunction in Alzheimer's Disease With Optical Coherence Tomography", "status": "ENROLLING_BY_INVITATION", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease", "Mild Cognitive Impairment"], "interventions": [{"type": "DIAGNOSTIC_TEST", "name": "Optical Coherence Tomography", "description": "The retina is imaged using infrared light. Images collected in light are compared to those collected in darkness to extract information about function."}], "primary_outcomes": ["Light-dependent Change in Optical Coherence Tomography Images"], "enrollment": 100, "sponsor": "University of California, Davis", "collaborators": ["National Institute on Aging (NIA)"], "start_date": "2023-09-29", "completion_date": "2028-02-28", "last_updated": "2025-12-05", "summary": "Years before someone experiences the symptoms of Alzheimer's disease, a compound called amyloid beta (Aβ) builds up in the brain. Excess Aβ - directly or indirectly - causes many of the symptoms of Alzheimer's dementia. However, recent studies of the FDA-approved drugs lecanemab (Leqembi®) and aducanumab (Aduhelm®) indicate that removing Aβ from the brain doesn't stop Alzheimer's. Clearly, there are other problems that need to be fixed. The investigators are interested in the cause of Aβ buildup. Non-neuronal support cells, called glia, keep neurons healthy by regulating water and nutrient levels for the neurons. They also help clear Aβ away from neurons. Maybe Aβ builds up when glia are unhealthy. Glia are very hard to study in the brain. Luckily, the light-sensing part of the eye - the retina - is an extension of the brain. The investigators study glia in the retina to learn about glia in the brain. To study retinal glia, the investigators take pictures of the retina with optical coherence tomography (OCT). OCT is safe, painless, and is used in many eye clinics to look at the structure of the retina. When the investigators take OCT pictures under a bright light, and compare those to OCT pictures collected in darkness, it gives the investigators information about glial function. In a study published in 2020 (\"Optical coherence tomography reveals light-dependent retinal responses in Alzheimer's disease\") the investigators showed that this functional OCT measurement was different in people with Alzheimer's dementia, compared to age-matched healthy adults. The goal of this observational study is to compare people at a pre-dementia stage of Alzheimer's disease to people who do not have any signs at all of Alzheimer's disease. By \"pre-dementia stage\", the investigators mean people who are either cognitively normal, or have mild cognitive impairment, but have had a medical test that shows the chemical beginnings of Alzheimer's disease. Members of the comparison group will also be cognitively normal, or have mild cognitive impairment, but had a medical test that shows utterly no signs of Alzheimer's disease. The main question this study, is whether functional OCT can tell these two groups apart. If so, that would: * Help build the case for glial health being important in the earliest stages of Alzheimer's, which in turn could lead to new treatment strategies, and * Suggest that functional OCT might be used as an early (pre-dementia) screening test for Alzheimer's disease Participants will: * undergo a brief eye exam (the investigators will not dilate pupils for this study) * undergo a paper-and-pencil cognitive test (to help verify \"normal\" or \"mild cognitive impairment\" status) * take brief one-page survey to collect demographic information (like age) * permit limited access to pre-existing medical or research records (to verify the presence/absence of the chemical beginnings of Alzheimer's disease) * take several OCT pictures of both eyes, in light and after 2 minutes of darkness (several rounds of images are taken) The expectation is that all study procedures will fit within 2 hours of one day.", "source_url": "https://clinicaltrials.gov/study/NCT06023446", "scraped_at": "2026-09-05T21:29:54.630442+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07591727", "title": "A Study of the Metabolic Reconstruction Oral Biologics (Gut-X-001) Medication in People With Alzheimer's Disease (ESCAPE-AD)", "official_title": "Efficacy, Safety, and Feasibility of Metabolic ReConstruction Oral Biologics (Gut-X-001) in Patients With Alzheimer's Disease: An Exploratory Clinical Trial （ESCAPE-AD）", "status": "NOT_YET_RECRUITING", "phase": "PHASE1, PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer s Disease"], "interventions": [{"type": "DRUG", "name": "Gut-X-001 + Placebo capsule", "description": "Participants will receive Gut-X-001 orally at a dose of 2 active capsules (10 mg of active ingredient per capsule) plus 2 placebo capsules (0 mg of active ingredient per capsule) per administration, 3 times daily (at 8:00 AM, 12:00 PM, and 10:00 PM), administered before meals and before bedtime. Total active ingredient per administration: 20 mg; total daily dose: 60 mg."}, {"type": "DRUG", "name": "Gut-X-001", "description": "Participants will receive Gut-X-001 orally at a dose of 4 active capsules (10 mg of active ingredient per capsule) per administration, 3 times daily (at 8:00 AM, 12:00 PM, and 10:00 PM), administered before meals and before bedtime. Total active ingredient per administration: 40 mg; total daily dose: 120 mg."}, {"type": "DRUG", "name": "Placebo", "description": "Participants will receive 4 placebo capsules (0 mg of active ingredient per capsule) orally per administration, 3 times daily (at 8:00 AM, 12:00 PM, and 10:00 PM), administered before meals and before bedtime. Placebo capsules are identical in appearance to the active Gut-X-001 capsules to maintain blinding."}], "primary_outcomes": ["Change from baseline in ADAS-Cog13 score at Month 6"], "enrollment": 120, "sponsor": "Beijing Tiantan Hospital", "collaborators": ["Beijing University of Chemical Technology", "Jilin University"], "start_date": "2026-08-01", "completion_date": "2027-12-01", "last_updated": "2026-06-11", "summary": "This is an exploratory clinical trial aimed at preliminarily evaluating the efficacy, safety, and feasibility of orally administered Gut-X-001 in patients with Alzheimer's disease (AD). An open-label extension (OLE) study will also be conducted to further investigate the effects of Gut-X-001. The study will assess the effects of Gut-X-001 on cognitive function, activities of daily living, neuroimaging indicators, and AD-related plasma biomarkers in AD patients. Safety will be systematically monitored, including the incidence of adverse events and changes in hematological and organ function parameters. Furthermore, the study will explore the regulatory effects of Gut-X-001 versus placebo on venous blood redox-related indicators and gut microbiota metabolite levels at different time points, providing a basis for multi-target intervention strategies and offering systematic evidence for the scientific rationale, feasibility, and safety of Gut-X-001 in the clinical management of AD.", "source_url": "https://clinicaltrials.gov/study/NCT07591727", "scraped_at": "2026-09-05T21:29:54.630442+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT05004987", "title": "Aβ Dynamics in LLMD", "official_title": "Depression Treatment and Aβ Dynamics: A Study of Alzheimer's Disease Risk (ABD Study)", "status": "RECRUITING", "phase": "PHASE4", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease", "Major Depressive Disorder"], "interventions": [{"type": "DRUG", "name": "Escitalopram Oxalate", "description": "The daily dose of ESC/PBO will be 10 mg for the first 2 weeks, then increase to 20 mg as tolerated, with an option to reduce back to 10 mg if necessary."}, {"type": "DRUG", "name": "Placebo", "description": "Daily dose of placebo will mimic that of ESC."}], "primary_outcomes": ["Change in Cerebrospinal Fluid (CSF) Aβ40 Biomarker Levels", "Change in Cerebrospinal Fluid (CSF) Aβ42 Biomarker Levels", "Change in Vascular Dysfunction (VD) Biomarker Levels", "Change in Scores on Montgomery-Asberg Depression Ration Scale (MADRS)"], "enrollment": 60, "sponsor": "NYU Langone Health", "collaborators": ["National Institute on Aging (NIA)"], "start_date": "2022-02-04", "completion_date": "2027-06-30", "last_updated": "2026-05-06", "summary": "This study will examine the biological factors that may modulate the relationship between depression and the development of Alzheimer's disease (AD). Since the direction of causation between depression and the biological factors associated with AD is unknown, the only way to understand cause and associated risk is to treat the depressive symptoms and examine the effects on AD biomarkers. The study involves an FDA-approved treatment for major depressive disorder. It will compare the SSRI antidepressant escitalopram with placebo. The hypothesis is that a reduction in depressive symptoms will be associated with a normalization of CSF AD biomarkers as well as peripheral inflammatory markers. This research would contribute to fundamental knowledge about potentially modifiable risks of Alzheimer's disease (AD).", "source_url": "https://clinicaltrials.gov/study/NCT05004987", "scraped_at": "2026-09-05T21:29:54.630442+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT02434393", "title": "Characterizing Cognitive Decline in Late Life Depression: The ADNI Depression Project", "official_title": "Characterizing Cognitive Decline in Late Life Depression: The Alzheimer's Disease Neuroimaging Initiative - Depression Project", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Major Depression", "Late Life Depression (LLD)"], "interventions": [], "primary_outcomes": ["Rate of Change in neuropsychological measures of executive function as measured by the Digit Symbol Substitution Test using total correct.", "Rate of Change in expressive language as measured by the Boston Naming Test using total correct.", "Rate of change in learning and memory as measured by the Rey Auditory Verbal Learning Test using total correct and delayed recall.", "Change in brain structure using magnetic resonance imaging (MRI)", "Extent of amyloid deposition as measured by florbetapir", "Extent of tau deposition as measured by flortaucipr"], "enrollment": 120, "sponsor": "University of Southern California", "collaborators": ["National Institute of Mental Health (NIMH)", "University of California, San Francisco", "Alzheimer's Therapeutic Research Institute"], "start_date": "2015-03-04", "completion_date": "2027-05", "last_updated": "2025-11-25", "summary": "The purpose of this research study is to characterize the mechanisms contributing to cognitive impairment and accelerated cognitive decline in Late Life Depression (LLD). This is a non-randomized, observational, non-treatment study that originally launched in 2015, enrolling 133 participants. From the originally enrolled participants, the continuation of the ADNI-D study will enroll 120 participants which will include following participants from the original (parent) protocol and enrollment of new participants for a period of 30 months. Data from an additional 300 non-depressed subjects will be used from ADNI studies for comparison. Depression history, symptom severity and health information will be collected at the initial visit to determine eligibility. An magnetic resonance imaging (MRI) scan, as well as amyloid (florbetapir) and tau (flortaucipr) positron emission tomography (PET) imaging will be conducted at San Francisco VA. Collection of plasma and serum for biomarkers, clinical assessments and cognitive assessments will be conducted at two time points. Blood samples will also be collected for genetic analysis.", "source_url": "https://clinicaltrials.gov/study/NCT02434393", "scraped_at": "2026-09-05T21:29:54.631207+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07533084", "title": "Italian Validation of the dNA Scale and Its Correlation With Neurocognitive Variables", "official_title": "Italian Validation of the Dynamic Neurocognitive Adaptation (dNA) Scale and Its Correlation With Neurocognitive Variables", "status": "NOT_YET_RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Active Aging Individuals Aged 65 and Over", "Aging", "Mild Cognitive Impairment (MCI)", "Dementia", "Dementia Alzheimer Type", "Subjective Memory Complaints", "Probable Alzheimer's Disease"], "interventions": [], "primary_outcomes": ["Italian Validation and Factor Structure of the dynamic Neurocognitive Adaptation Scale (dNA)"], "enrollment": 265, "sponsor": "Neuromed IRCCS", "collaborators": ["Istituto ricerca carattere Scientifico Fatebenefratelli Brescia", "IRCCS National Neurological Institute \"C. Mondino\" Foundation", "Fondazione I.R.C.C.S. Istituto Neurologico Carlo Besta", "IRCCS San Camillo, Venezia, Italy", "IRCCS Ospedale San Raffaele", "Campus Bio-Medico University", "IRCCS Azienda Ospedaliera Universitaria San Martino - IST Istituto Nazionale per la Ricerca sul Cancro, Genoa, Italy", "Università degli Studi 'G. d'Annunzio' Chieti e Pescara", "University of Foggia", "University of Padova"], "start_date": "2026-09", "completion_date": "2027-11-27", "last_updated": "2026-06-11", "summary": "The goal of this experimental multicentric intervention study is to validate, in Italian, the dynamic Neurocognitive Adaptation (dNA) Scale, which has already been validated in English, among a healthy elderly population (aged 65 and older) residing in Italy and patients with dementia or Alzheimer's Disease. dNA is a questionnaire designed to assess both current and past levels of engagement in physical, cognitive, creative, and social activities. The study aims to recruit a total of 265 participants with mild cognitive impairment, subjective memory complaints, or dementia. These participants will be distributed among the 8 recruitment centers. Neuropsychological data, subjective measures, and MRI data will be collected and analyzed to address the following research questions: 1) Is there a positive correlation between scores on the dNA Scale and cognitive efficiency, as reflected in neuropsychological measures, such as episodic memory and executive functions? 2) Is there a correlation between dNA scores and improved functional connectivity within neural networks, such as the Default Network (DN)? Participants recruited at the participating clinical centers will undergo: * A clinical interview, during which demographic and medical history information will be collected. The dNA Scale will be administered, along with a questionnaire assessing adherence to dietary habits typical of a Mediterranean diet (14-Item Mediterranean Diet Adherence Screener; MEDAS). * A neuropsychological assessment, aimed at evaluating general cognitive function with a particular focus on episodic memory and executive functions. The following tests will be administered: Mini-Mental State Examination (MMSE) or, alternatively, Montreal Cognitive Assessment (MoCA); Rey Auditory Verbal Learning Test (RAVLT); Trial Making Test (TMT) Form B; Digit Span Forward and Backward (WAIS or WAIS-III); and the Stroop Test. * Self-report questionnaires designed to assess depressive symptoms using the Geriatric Depression Scale (GDS) and anxiety symptoms using the Geriatric Anxiety Scale (GAS) (or alternatively the State-Trait Anxiety Inventory, STAI). Finally, the Cognitive Reserve Index Questionnaire will be administered to estimate Cognitive Reserve (CRIq). * Where available, MRI data previously acquired for clinical or diagnostic purposes will be included in the study and analyzed by the principal investigator.", "source_url": "https://clinicaltrials.gov/study/NCT07533084", "scraped_at": "2026-09-05T21:29:54.631207+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06585384", "title": "Safety of a Strategy Combining Etanercept Administration With Repeated Contrast Ultrasound in Patients With Alzheimer's Disease", "official_title": "Safety of a Strategy Combining Etanercept Administration With Repeated Contrast Ultrasound in Patients With Alzheimer's Disease: Phase I Study", "status": "RECRUITING", "phase": "PHASE1", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease"], "interventions": [{"type": "COMBINATION_PRODUCT", "name": "etanercept and repeated contrast ultrasound", "description": "Strategy combining 9 weeks of etanercept administration (50mg/week) with 5 weeks of repeated contrast ultrasound of 2 sessions per day, 5 days per week (from the fifth week of etanercept treatment)"}], "primary_outcomes": ["To assess the safety of a strategy combining 9 weeks of etanercept administration with 5 weeks of repeated contrast ultrasound of 2 sessions per day, 5 days per week (from the fifth week of etanercept treatment) in patients with Alzheimer&#39;s disease."], "enrollment": 5, "sponsor": "Fondation Ophtalmologique Adolphe de Rothschild", "collaborators": [], "start_date": "2025-04-15", "completion_date": "2028-12", "last_updated": "2026-05-12", "summary": "Alzheimer's disease (AD) is a clinico-pathological entity combining multiple and varied neuropathological lesions with characteristic abnormal accumulations (amyloid Beta (Aβ) plaques and neurofibrillary degeneration (NFD)), neuroinflammation, as well as neuronal and synaptic suffering. To date, only symptomatic treatments are available, with no proven effect on neuropathological lesions or on the clinical course of the disease. Anti-TNF alpha could be a therapeutic agent of choice in the treatment of central nervous sytem (CNS) diseases with an inflammatory component, such as AD. Unfortunately, their high molecular weight prevents them from passively crossing the blood brain barrier (BBB). In a pilot study published in 2006, etanercept was administered intrathecally to AD patients with encouraging clinical effects. Transient opening of the tight junctions between the endothelial cells of the BBB by delivering High Intensity Focalised Ultrasounds (HIFU) in combination with an intravenous injection of microbubbles is a strategy that could improve bioavailability. Studies suggest that the oscillation of microbubbles in the ultrasound field generates microcurrents that induce shear forces responsible for a transient opening of the BBB. Ultrasound can be focused or unfocused and open the BBB diffusely or selectively over defined regions of the brain. This technique was first used to open the BBB in humans in 2001. Transient opening of the BBB is also thought to modulate the immune response in the CNS, leading to a reduction in the intracerebral load of Aβ. In an Alzheimer's mouse model, several studies using ultrasound devices to open the BBB have shown a reduction in the intracerebral load of Aβ (up to 75%) and an improvement in the memory faculties and cognitive performance of the animals. In humans, two clinical trials have assessed the safety of using ultrasound-assisted BBB disruption devices in AD patients. These were the Sonocloud® (Carthera) and ExAblate® (InSightec) devices. The Sonocloud® device is an extra-dural ultrasound emitter implanted under local anaesthetic. Enrolment was completed in October 2020, but the results of the trial are not yet available (NCT03119961). The phase I study on 5 patients evaluating the ExAblate® device coupled with the injection of gas microbubbles demonstrated reversible opening of the BBB with no serious adverse effects for the patients. No effect on intracerebral Aβ load or cognitive or behavioural improvement was demonstrated. The ExAblate® device is not implantable and is therefore less invasive than the Sonocloud® device. However, it requires MRI monitoring and the transducers used often generate high levels of heat, requiring the use of a water cooling system to avoid the risk of transducer deterioration. In this project, our aim is to assess the safety of using a non-focused ultrasound device, the General Electric VIVID S70 clinical device (CE mark G1 023782 0112 ), to perform BBB ruptures in patients suffering from AD, combined with the administration of etanercept, whose bioavailability would thus be improved.", "source_url": "https://clinicaltrials.gov/study/NCT06585384", "scraped_at": "2026-09-05T21:29:54.631207+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06126224", "title": "A Study to Assess Efficacy and Safety of KarXT for the Treatment of Psychosis Associated With Alzheimer's Disease (ADEPT-2)", "official_title": "A Phase 3, Randomized, Double-Blind, Placebo-Controlled, Parallel Group Study to Evaluate the Safety and Efficacy of KarXT for the Treatment of Psychosis Associated With Alzheimer's Disease", "status": "RECRUITING", "phase": "PHASE3", "study_type": "INTERVENTIONAL", "conditions": ["Psychosis Associated With Alzheimer's Disease"], "interventions": [{"type": "DRUG", "name": "KarXT", "description": "KarXT 20/2 mg (total daily dose \\[TDD\\] 60/6 mg) KarXT 30/3 mg (TDD 90/9 mg) KarXT 40/4 mg (TDD 120/12 mg) KarXT 50/5 mg (TDD 150/15 mg) KarXT 66.7/6.67 mg (TDD 200/20 mg)"}, {"type": "DRUG", "name": "Placebo", "description": "Placebo capsules"}], "primary_outcomes": ["Change from Baseline to End of Treatment in the Neuropsychiatric Inventory-Clinician: Hallucinations and Delusions (NPI-C: H+D) score"], "enrollment": 500, "sponsor": "Karuna Therapeutics, Inc., a Bristol Myers Squibb company", "collaborators": [], "start_date": "2023-08-28", "completion_date": "2026-12-09", "last_updated": "2026-09-04", "summary": "This is a Phase 3, randomized, double-blind, placebo-controlled, parallel group study to evaluate the safety and efficacy of KarXT in male and female subjects who are aged 55 to 90 years and have mild to severe Alzheimer's Disease (AD) with moderate to severe psychosis related to AD. The primary objective of the study is to evaluate the efficacy of KarXT compared with placebo in the treatment of subjects with psychosis associated with AD as measured by the Neuropsychiatric Inventory-Clinician (NPI-C): Hallucinations and Delusions (H+D) score.", "source_url": "https://clinicaltrials.gov/study/NCT06126224", "scraped_at": "2026-09-05T21:29:54.631207+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07252440", "title": "A Study to Evaluate the Efficacy and Safety of TTYP01 Tablets in Early Symptomatic Alzheimer's Disease", "official_title": "A Prospective, International, Multicenter, Randomized, Double-Blind, Placebo-Controlled, Parallel Study to Evaluate the Efficacy and Safety of TTYP01 Tablets in Early Symptomatic Alzheimer's Disease", "status": "RECRUITING", "phase": "PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["AD", "Early Alzheimer's Disease"], "interventions": [{"type": "DRUG", "name": "TTYP01 tables 60mg", "description": "2 TTYP01 30 mg tablets + 1 placebo tablet BID"}, {"type": "DRUG", "name": "TTYP01 tables 90mg", "description": "(3 TTYP01 30 mg tablets"}, {"type": "DRUG", "name": "TTYP01 tables 0mg", "description": "3 placebo tablets"}], "primary_outcomes": ["Change from baseline in the Clinical Dementia Rating Scale-Sum of Boxes (CDR-SB) score at Week 78.", "Number of participants with Adverse events, serious adverse events, adverse events of special interest"], "enrollment": 180, "sponsor": "Shanghai Auzone Biological Technology Co., Ltd.", "collaborators": [], "start_date": "2025-12-19", "completion_date": "2028-11-23", "last_updated": "2026-07-16", "summary": "This is a multicenter, randomized, double-blind, placebo-controlled parallel Phase II core period study to evaluate the efficacy and safety of TTYP01 Tablets in early symptomatic AD (Mild cognitive impairment \\[MCI\\] due to AD, or mild AD dementia). A total of 180 participants will be randomized into 3 parallel groups: 2 TTYP01 dose groups and 1 placebo group.", "source_url": "https://clinicaltrials.gov/study/NCT07252440", "scraped_at": "2026-09-05T21:29:54.631207+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06183658", "title": "Greater-Bay-Area Healthy Aging Brain Study (GHABS)", "official_title": "Greater-Bay-Area Healthy Aging Brain Study (GHABS): Biomarker- and Neuroimaging-based Study of the Pathophysiology Characterization and Evolutionary Patterns of Alzheimer's Disease", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer's Disease"], "interventions": [{"type": "DIAGNOSTIC_TEST", "name": "Fluids biomarker and neuroimaging of AD diagnosis", "description": "Early diagnosis of Alzheimer's disease in South China aging population using fluids biomarker and neuroimaging."}], "primary_outcomes": ["Longitudinal changes of cognitive function _ ADAS-Cog", "Longitudinal changes of cognitive function _ MMSE, the Chinese version", "Longitudinal changes of cognitive function _ MoCA-Basic", "Longitudinal functional and behavioral function _ CDR", "Longitudinal functional and behavioral function _ NPI", "Longitudinal functional and behavioral function _ GDS", "Longitudinal functional and behavioral function _ FAQ", "Longitudinal functional and behavioral function _ ADL", "Longitudinal functional and behavioral function _ PSQI", "Longitudinal functional and behavioral function _ RBDSQ"], "enrollment": 1400, "sponsor": "Shenzhen Bay Laboratory", "collaborators": ["National Natural Science Foundation of China", "Guangdong Basic and Applied Basic Science Foundation", "Shenzhen Science and Technology Innovation Commission"], "start_date": "2021-05-01", "completion_date": "2026-04-30", "last_updated": "2025-05-14", "summary": "The goal of this observational study is to learn about the pathophysiology characterization and evolutionary patterns of Alzheimer's disease (AD) in South China older adults. The primary purposes are as follows: 1. The prevalence and characteristics of AD in South China's aging population 2. Identify novel biomarkers and neuroimaging techniques for early detection and intervention of AD 3. Supporting and fertilizing novel approaches and techniques for early diagnosis and intervention of AD Participants will undergo cognitive assessments, blood sample collection, and genetic testing. Some will undergo CSF collection, stool sample collection, MRI scanning, Aβ PET scanning, and tau PET scanning.", "source_url": "https://clinicaltrials.gov/study/NCT06183658", "scraped_at": "2026-09-05T21:29:54.631733+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT05059158", "title": "Amyloid-β Clearance Mechanisms in Alzheimer's Disease", "official_title": "Amyloid-β Clearance Mechanisms: A Multi-modal Study on Lymphatic, Glymphatic and Blood-brain-barrier Function in Alzheimer's Disease", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer's Disease (AD)"], "interventions": [{"type": "RADIATION", "name": "positron emission tomography (PET)", "description": "18-Flutemetamol PET (clinical indicated) is going to be performed at the visit."}], "primary_outcomes": ["Differences in the disruption of the brain-blood-barrier between the subgroups", "Clearance mechanisms and glymphatic or cerebral lymphatic system", "Connection between the structural/functional connectivity of the resting networks and the clearance mechanisms", "Differences between sleep and activity in SCD, MCI and AD; Do they have a mediator role in association of the BBB disruption and Aß pathology?", "Connection between clinical symptoms, Aß pathology and BBB disorder"], "enrollment": 60, "sponsor": "Ludwig-Maximilians - University of Munich", "collaborators": [], "start_date": "2021-06-01", "completion_date": "2025-10", "last_updated": "2025-07-04", "summary": "The focus of this study is to examine the protein-plaque clearance (Aß) in relation to the blood-brain-barrier, the glymphatic system, brain lymphatic system and enzymatic degradation. In order to achieve this aim the investigators intend to study participants with a Subjective Cognitive Decline, Mild Cognitive Impairment and a mild Alzheimer's disease.", "source_url": "https://clinicaltrials.gov/study/NCT05059158", "scraped_at": "2026-09-05T21:29:54.631733+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07580703", "title": "A Phase I Study of [18F]Flortaucipir PET Imaging in Chinese Subjects: Safety, Pharmacokinetics, Biodistribution, Radiation Dosimetry, and Preliminary Diagnostic Efficacy", "official_title": "A Non Randomized, Open-Label Phase I Study to Evaluate the Safety and Tolerability, Pharmacokinetics, Biodistribution and Radiation Dosimetry, and Preliminary Diagnostic Efficacy of [18F]Flortaucipir Injection PET Imaging in Chinese Subjects", "status": "RECRUITING", "phase": "PHASE1", "study_type": "INTERVENTIONAL", "conditions": ["AD - Alzheimer's Disease", "MCI"], "interventions": [{"type": "DRUG", "name": "[18F]Flortaucipir Injection", "description": "A radioactive diagnostic agent intended for brain positron emission tomography (PET) imaging in adult patients with cognitive impairment who are being evaluated for Alzheimer's disease (AD), to estimate the density and distribution of aggregated tau neurofibrillary tangles (NFTs)."}], "primary_outcomes": ["Incidence and Severity of Treatment-Emergent Adverse Events (TEAEs)"], "enrollment": 18, "sponsor": "Eli Radiopharma", "collaborators": [], "start_date": "2026-04-23", "completion_date": "2027-03-31", "last_updated": "2026-05-14", "summary": "This is a non randomized, open-label Phase I study in Chinese participants. The goal of this clinical trial is to evaluate the safety and tolerability of a radioactive imaging agent called \\[18F\\]Flortaucipir Injection, which is used during a PET scan. The study will also measure how the agent moves through the body (pharmacokinetics), where it goes (biodistribution), the amount of radiation exposure (radiation dosimetry), and how well it may help detect signs of disease (preliminary diagnostic efficacy).", "source_url": "https://clinicaltrials.gov/study/NCT07580703", "scraped_at": "2026-09-05T21:29:54.631733+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07756294", "title": "Restoring Vascular and Insulin Function To Augment Anti-Amyloid Therapy in Alzheimer's Disease", "official_title": "REstoring Vascular and Insulin Function To Augment Anti-Amyloid Therapy in ALZheimer'ss Disease (REVITAA-ALZ): A Placebo-controlled Trial of Intranasal Insulin vs. Empagliflozin in Mild Cognitive Impairment (MCI) or Early Alzheimer's Disease (AD) Treated With Anti-Amyloid Targeting Therapy (Lecanemab or Donanemab)", "status": "NOT_YET_RECRUITING", "phase": "PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease"], "interventions": [{"type": "DRUG", "name": "Empagliflozin", "description": "empagliflozin 10 mg every day"}, {"type": "DRUG", "name": "Insulin", "description": "Intranasal insulin 40 international units four times daily"}, {"type": "DRUG", "name": "Insulin Placebo", "description": "matching placebo for intranasal insulin"}, {"type": "DRUG", "name": "Empagliflozin Placebo", "description": "matching placebo for empagliflozin"}], "primary_outcomes": ["Number of treatment-related serious adverse events"], "enrollment": 30, "sponsor": "Wake Forest University Health Sciences", "collaborators": [], "start_date": "2026-09", "completion_date": "2028-04", "last_updated": "2026-08-25", "summary": "The purpose of this study is to find out what effects (good and bad) the study medications (insulin or Empagliflozin) have on adults with mild memory impairment or early Alzheimer's disease who are clinically prescribed an anti-amyloid therapy compared to placebo.", "source_url": "https://clinicaltrials.gov/study/NCT07756294", "scraped_at": "2026-09-05T21:29:54.631733+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07420075", "title": "Alzheimer's Registry", "official_title": "PPD™ CorEvitas™ International Alzheimer's (ALZ) Drug Safety and Effectiveness Registry", "status": "ENROLLING_BY_INVITATION", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease"], "interventions": [], "primary_outcomes": ["Alzheimer Disease Epidemiology and presentation", "Alzheimer Disease management, and outcomes"], "enrollment": 2000, "sponsor": "CorEvitas", "collaborators": [], "start_date": "2025-11-24", "completion_date": "2099-12-31", "last_updated": "2026-02-19", "summary": "The design is an open-ended, prospective, observational, (non-interventional) registry for subjects with mild cognitive impairment (MCI), early symptomatic Alzheimer's disease, Alzheimer's disease, or dementia with clinical suspicion of Alzheimer's disease under the care of a neurologist, psychiatrist, geriatrician or other qualified provider. Longitudinal data are collected from subjects, their care partner(s), and their treating healthcare provider during routine clinical encounters using a structured and standardized data collection method. Approximately 2,000 subjects, with no defined upper limit, across around 75 clinical sites worldwide will be recruited.", "source_url": "https://clinicaltrials.gov/study/NCT07420075", "scraped_at": "2026-09-05T21:29:54.631733+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06448403", "title": "Multimodal Assesment of Alzheimer Patients", "official_title": "Multimodal Assessment of Cognitive Impairment in Alzheimer Patients", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Mild Cognitive Impairment", "Alzheimer Disease, Late Onset", "Cognitive Impairment", "Dementia"], "interventions": [{"type": "DEVICE", "name": "MRI Scanning", "description": "MRI scanning with volumetric, resting and activity-based sequences."}, {"type": "DEVICE", "name": "64-channel EEG", "description": "EEG to quantifiy electric activity."}, {"type": "DEVICE", "name": "Polysomnography", "description": "A randomized group will undergo polysomnography."}, {"type": "BIOLOGICAL", "name": "Blood samples", "description": "Analysis of specific blood biomarkers."}, {"type": "BIOLOGICAL", "name": "Fecal samples", "description": "Analysis of bacterial composition."}, {"type": "BEHAVIORAL", "name": "Cognitive tests", "description": "Interview-based cognitive tests for assesment of cognitive levels."}], "primary_outcomes": ["MCI-AD converters", "AD-subclassification"], "enrollment": 60, "sponsor": "Norwegian University of Science and Technology", "collaborators": [], "start_date": "2024-07-01", "completion_date": "2030-12-29", "last_updated": "2026-08-13", "summary": "The goal of this study is to learn more about the changes in the brains of patients with cognitive impairment (MCI) and Alzheimer's Disease (AD). The main questions the study aims to answer are: 1. What findings can be used to earlier detect patients that will develop Alzheimers? 2. Which differences are seen between healthy and cognitively impaired patients? 3. Which differences are seen between patients with Alzheimers disease? Participants will undergo: * Cognitive tests * Magnetic resonance imaging (MRI) * Electroencephalography (EEG) * Blood sample collection * Fecal sample collection * A randomized group will undergo polysomnography analysis.", "source_url": "https://clinicaltrials.gov/study/NCT06448403", "scraped_at": "2026-09-05T21:29:54.631733+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07167966", "title": "Alzheimer's Tau Platform: Regimen A - AADvac1", "official_title": "Alzheimer's Tau Platform (ATP): Regimen Specific Appendix for AADvac1", "status": "ENROLLING_BY_INVITATION", "phase": "PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["Preclinical Alzheimer's Disease", "Prodromal Alzheimer's Disease", "Alzheimer Disease"], "interventions": [{"type": "DRUG", "name": "AADvac1", "description": "Subcutaneous injection of AADvac1"}, {"type": "DRUG", "name": "Donanemab", "description": "Active comparator: intravenous infusion of donanemab"}], "primary_outcomes": ["Reduction of brain tau deposition as measured by tau positron emission tomography (PET)"], "enrollment": 450, "sponsor": "Paul S. Aisen", "collaborators": ["Axon Neuroscience SE", "University of California, San Francisco", "Massachusetts General Hospital", "Alzheimer's Therapeutic Research Institute", "Alzheimer's Clinical Trials Consortium", "National Institute on Aging (NIA)"], "start_date": "2026-11-03", "completion_date": "2028-08-31", "last_updated": "2026-07-09", "summary": "The Alzheimer's Tau Platform (ATP) is a multi-center platform trial to evaluate the safety and effectiveness of tau-directed therapies, alone or in combination with donanemab, in adults aged 50-80 with late preclinical or early prodromal Alzheimer's disease. Regimen A will evaluate the safety and efficacy of AADvac1, alone or in combination with donanemab.", "source_url": "https://clinicaltrials.gov/study/NCT07167966", "scraped_at": "2026-09-05T21:29:54.632262+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06631742", "title": "Exergaming Revolution in Dementia", "official_title": "The Effect of an Exergaming Intervention on Physical Activity and Sleep in People With Major Neurocognitive Disorders Living in Long-term Care Facilities: a Pilot Randomized Controlled Trial.", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Major Neurocognitive Disorder", "Alzheimer Disease", "Parkinson Disease", "Lewy Body Dementia", "Mixed Dementias"], "interventions": [{"type": "OTHER", "name": "Exergaming on Dividat Senso", "description": "The active dance video game is played with the Dividat Senso (Dividat \\| Senso: cognitive-motor training). It consists of a dance disc with four arrows (up, down, left, right), and the game is played on a large screen (which is connected to the PC). The screen indicates which arrow the person should step on, thus controlling the game through body movements. The games give the person feedback in the form of auditory, visual, and somatosensory stimuli."}, {"type": "OTHER", "name": "Usual Care", "description": "Standardised care with meal service, individual activities (e.g. hiking group, walking group, exercise group, handicrafts, gardening group, singing, painting or lunch) and customized care and support as required."}], "primary_outcomes": ["Short Physical Performance Battery", "Short Phyiscal Performance Battery"], "enrollment": 48, "sponsor": "Eastern Switzerland University of Applied Sciences", "collaborators": [], "start_date": "2024-09-27", "completion_date": "2027-04-30", "last_updated": "2024-10-08", "summary": "This pilot randomized controlled trial evaluates the effect of a 12 weeks exergaming training in people with major neurocognitive disorders (MNCD) living in long-term care facilities.", "source_url": "https://clinicaltrials.gov/study/NCT06631742", "scraped_at": "2026-09-05T21:29:54.632262+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT05561205", "title": "rTMS for Apathy Clinical Trial", "official_title": "Repetitive Transcranial Magnetic Stimulation for Apathy Clinical Trial (REACT)", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease", "Apathy in Dementia", "Dementia", "Mild Behavioural Impairment", "Mild Cognitive Impairment", "Neurocognitive Disorders"], "interventions": [{"type": "DEVICE", "name": "rTMS", "description": "repetitive transcranial magnetic stimulation"}, {"type": "DRUG", "name": "methylphenidate", "description": "methylphenidate"}], "primary_outcomes": ["Neuropsychiatric Inventory-apathy"], "enrollment": 10, "sponsor": "Sunnybrook Health Sciences Centre", "collaborators": [], "start_date": "2023-02-09", "completion_date": "2026-12-01", "last_updated": "2026-04-13", "summary": "Apathy is a common, early, and disabling symptom in dementias and mild behavioural impairment such as Alzheimer's disease (AD) and is characterized by lack of interest and enthusiasm. Both repetitive transcranial magnetic stimulation (rTMS), a form of non-invasive brain stimulation, and methylphenidate, a medication, have been shown to improve apathy. This pilot study will investigate rTMS as a treatment for apathy in neurocognitive disorders and mild behavioural impairment in individuals receiving methylphenidate and individuals not receiving medication for apathy.", "source_url": "https://clinicaltrials.gov/study/NCT05561205", "scraped_at": "2026-09-05T21:29:54.632262+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07419022", "title": "Improv Music Therapy for Older Adults", "official_title": "Impact of Improvisation Music Therapy for Persons Living With Dementia and Their Care Partners", "status": "NOT_YET_RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer's Disease (AD)", "Older Adults (65 Years and Older)"], "interventions": [{"type": "BEHAVIORAL", "name": "Clinical Improvisation", "description": "Clinical improvisation music therapy offered as group sessions delivered by board-certified music therapist."}], "primary_outcomes": ["Science of Behavior Change (SOBC) Brief-COPE", "SOBC Perceived Stress Scale"], "enrollment": 40, "sponsor": "University of California, San Francisco", "collaborators": ["National Institute on Aging (NIA)"], "start_date": "2026-12", "completion_date": "2028-12", "last_updated": "2026-02-23", "summary": "Older adults and their care partners will participate in music therapy sessions for approximately 8 weeks. Before and after the 8 week study period, participants will fill out questionnaires about their mood, stress levels, and emotions. During the music therapy sessions, they may be observed or asked questions about the music therapy sessions.", "source_url": "https://clinicaltrials.gov/study/NCT07419022", "scraped_at": "2026-09-05T21:29:54.632262+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07603973", "title": "Effect of an Information- and Self-management App for People With Knee Osteoarthritis", "official_title": "Effect of an Information- and Self-management App for People With Knee Osteoarthritis", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Knee Osteoarthritis"], "interventions": [{"type": "DEVICE", "name": "Information- and self-management app", "description": "An information- and self-management intervention delivered through the Genus app, including information videos, exercise videos, questionnaires, quizzes and feedback provided over an 8 week period prior to consultation in specialist healthcare"}, {"type": "OTHER", "name": "Control", "description": "Information on where to access publically available information about knee osteoarthritis"}], "primary_outcomes": ["Knee Osteoathritis Knowlegde Scale (KOAKS)", "Decision Conflict Scale (DCS)"], "enrollment": 204, "sponsor": "Diakonhjemmet Hospital", "collaborators": [], "start_date": "2025-10-30", "completion_date": "2035-12-31", "last_updated": "2026-05-22", "summary": "The primary aim of the trial is to assess if an information- and self-management app provided in the period between referral and consultation in specialist healthcare can improve knowledge about osteoarthritis and decision quality during consultation in patients with knee osteoarthritis. 204 patients will be randomized to either being on the waiting list for consultation, accessing publically available information about osteoarthritis (control group) or getting access to an 8-week information- and self-management intervention delivered through the Genus app prior to consultation. Pasients with answer questionnaires at baseline, 4 weeks (intervention group only), 8 weeks, post consultation and 1 and 2 years after consultation. The Genus app contains information videos, exercise videos, quizzes, feedback and questionnaires provided in a progressive order over an 8 week period.", "source_url": "https://clinicaltrials.gov/study/NCT07603973", "scraped_at": "2026-09-05T21:29:54.632262+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06948929", "title": "Synbiotic Formula (SCV09) in Alzheimer's Disease Patients", "official_title": "A Pilot, Single-arm Study on the Efficacy and Safety of the Use of a Synbiotic Formula (SCV09) in Alzheimer's Disease Patients", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease"], "interventions": [{"type": "DIETARY_SUPPLEMENT", "name": "SCV09", "description": "SCV09 consists of a blend of four probiotic species from the Bifidobacterium and Lactobacillus genera (20 billion CFU in 1 sachet per day), prebiotic compounds including galacto-oligosaccharides, xylo-oligosaccharides and inulin, vitamin B6, B9, B12 and vitamin D."}], "primary_outcomes": ["Neuropsychiatric Inventory-Questionnaire"], "enrollment": 30, "sponsor": "Chinese University of Hong Kong", "collaborators": [], "start_date": "2025-05-15", "completion_date": "2026-12-15", "last_updated": "2025-09-03", "summary": "In recent years, emerging studies have revealed the role of gut microbiota in human health and diseases, including AD and other neurodegenerative conditions5. Although the underlying mechanism is still largely unknown, successful therapies targeting the gut-brain axis may serve as indirect evidence of the possible linkage. This pilot, single-arm study aims to estimate the efficacy and assess the safety profile of the use of a new synbiotic formula (SCV09) in improving dementia-related behaviour in Alzheimer's disease patients, paving the way for a large-scale randomised controlled trial in the future.", "source_url": "https://clinicaltrials.gov/study/NCT06948929", "scraped_at": "2026-09-05T21:29:54.632262+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07543094", "title": "Efficacy and Safety of Temporal Interference Stimulation on Cognitive Function in Patients With Early-Stage Alzheimer's Disease", "official_title": "A Randomized, Double-Blind, Controlled Trial to Evaluate the Efficacy and Safety of Temporal Interference Stimulation on Cognitive Function in Patients With Early-Stage Alzheimer's Disease", "status": "ENROLLING_BY_INVITATION", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimer Disease"], "interventions": [{"type": "DEVICE", "name": "Temporal Interference Stimulation", "description": "Device: The non-invasive brain stimulator NervioX is used to administer Temporal Interference Stimulation (TIS).\n\nStimulation Parameters:\n\nFrequencies: 2000 Hz and 2005 Hz (resulting in a 5 Hz theta rhythm envelope). Stimulation Intensity: 1.0-2.0 mA (peak current). Stimulation Target: Bilateral hippocampus Session Duration: 40 minutes per session. Treatment Course: 5 sessions per week, for 2 consecutive weeks, totaling 10 sessions."}, {"type": "DEVICE", "name": "Sham Stimulation", "description": "Device: The same NervioX device is used.\n\nStimulation Parameters:\n\nThe device is programmed to deliver a real stimulation (1.0-2.0 mA) for the initial 30 seconds of the session to mimic the initial sensation experienced by the active group.\n\nSubsequently, the current is automatically reduced to 0 mA for the remainder of the 40-minute session.\n\nThe device screen continues to display the stimulation as ongoing to maintain the blinding.\n\nThe session frequency and total course (5 sessions/week for 2 weeks, 10 sessions total) are identical to the active intervention group."}], "primary_outcomes": ["Changes in Alzheimer's Disease Assessment Scale-Cognitive Subscale (ADAS-Cog 11) Score"], "enrollment": 40, "sponsor": "Ruijin Hospital", "collaborators": [], "start_date": "2025-11-01", "completion_date": "2027-09-30", "last_updated": "2026-04-24", "summary": "This study aims to investigate the efficacy and safety of a novel non-invasive brain stimulation technique-Temporal Interference Stimulation (TIS)-in patients with early-stage Alzheimer's disease. A total of 40 participants will be randomly assigned to either the TIS group or the sham stimulation group. The intervention will last for 2 weeks, with cognitive and safety assessments at baseline, post-treatment, and 12 weeks after treatment.", "source_url": "https://clinicaltrials.gov/study/NCT07543094", "scraped_at": "2026-09-05T21:29:54.632262+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT05893524", "title": "Uppsala-Dalarna Dementia and Gait Project", "official_title": "Uppsala-Dalarna Dementia and Gait Project", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Dementia", "Dementia, Mixed", "Dementia Senile", "Dementia of Alzheimer Type", "Mild Cognitive Impairment", "Subjective Cognitive Impairment"], "interventions": [{"type": "DIAGNOSTIC_TEST", "name": "Timed Up-and-Go (TUG single-task)", "description": "The TUG test is a well-established clinical test of one mobility sequence: rising from an armchair, walking straight ahead, passing a line marked on the floor, turning around, walking back, and sitting down again."}, {"type": "DIAGNOSTIC_TEST", "name": "Timed Up-and-Go dual-task (TUGdt)", "description": "Two dual-task tests including TUG (TUGdt) were carried out: TUGdt naming animals and TUGdt months backwards. The outcomes registered were: time scores for TUG single-task and both TUGdt tests, TUGdt costs (relative time difference between TUG single-task and TUGdt), number of different animals named, number of months recited in correct order, number of animals per 10 s, and number of months per 10 s."}, {"type": "DIAGNOSTIC_TEST", "name": "Clinical functional assessment", "description": "The diagnostic procedure was part of the clinical routine for patients undergoing memory assessment and involved a geriatrician's careful evaluation of the patient's history and cognitive testing including Mini-Mental State Examination (MMSE), Clock Drawing Test, Verbal Fluency Test, and Trail Making Test A and B. In addition, all participants carried out short versions of the Geriatric Depression Scale and the General Motor Function Assessment Scale, as well as static balance according to the Bohannon Method, and hand grip strength using a dynamometer."}], "primary_outcomes": ["Conversion to dementia"], "enrollment": 550, "sponsor": "Dalarna University", "collaborators": ["Uppsala University", "The Swedish Research Council"], "start_date": "2015-04-09", "completion_date": "2026-12-24", "last_updated": "2025-02-12", "summary": "UDDGait™ is a multidisciplinary research project with the overreaching goal of providing an aid for early identification of cognitive impairment and risk of dementia development, thereby providing a basis for adequate symptom relieving and health promoting interventions. A new concept is investigated for this purpose: a \"dual-task-test\", which implies the combination of a well-established mobility test (Timed Up-and-Go, TUG) with a simultaneous verbal task (i.e. TUG dual-task, TUGdt). This type of test has been judged as a potential aid for early identification of dementia disease. More research is needed to further examine the test's validity, reliability and predictive capacity. The overall aim is to investigate if TUGdt is useful as an aid for prediction of dementia disease. To ensure the results, the aim is also to evaluate the test's measurement properties and to generate normative reference values of healthy control persons.", "source_url": "https://clinicaltrials.gov/study/NCT05893524", "scraped_at": "2026-09-05T21:29:54.632792+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT05077579", "title": "Alzheimer\"s Imaging Biomarkers in Obesity", "official_title": "Neuroinflammation and Alzheimer's Disease Imaging Biomarkers in Midlife Obesity", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer Disease", "Obesity", "Metabolic Disease"], "interventions": [], "primary_outcomes": ["Aim - increased atrophy in MAOO compared to MNOO and MNLP participants"], "enrollment": 240, "sponsor": "Cyrus A Raji", "collaborators": [], "start_date": "2021-10-18", "completion_date": "2027-12-31", "last_updated": "2026-05-11", "summary": "High body fat at midlife, as evidenced by overweight or obese body mass index (BMI), is increasingly understood as a risk factor for Alzheimer's disease. However, the underlying processes and mechanisms that may underlie this risk remains unknown. With this project, the Investigator proposes to create a new cohort of cognitively normal 120 midlife individuals, age 40-60 years. The investigator and research staff will characterize the participant's overweight or obese status using metabolic tests including, an oral glucose tolerance test, fasting plasma insulin, fasting plasma glucose, and hemoglobin A1c measurements. This testing will generate categories of metabolically abnormal overweight and obese (MAOO), metabolically normal overweight and obese (MNOO), and metabolically normal lean participants (MNLP). Research staff will evaluate differences between these groups on neuroimaging with the newer classification framework of Alzheimer's biomarkers with amyloid (A), tau (T), and neurodegeneration (N), or ATN. Neurodegeneration will be assessed by atrophy on brain MRI as reflected by regional volumes on Freesurfer. Staff will also evaluate MR neuroimaging markers for neuroinflammation using a newer method called diffusion basis spectrum imaging (DBSI), developed at the Mallinckrodt Institute of Radiology at Washington University in St. Louis in collaboration with The Charles F. and Joanne Knight Alzheimer's Disease Research Center (Knight ADRC).", "source_url": "https://clinicaltrials.gov/study/NCT05077579", "scraped_at": "2026-09-05T21:29:54.632792+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT06669546", "title": "Effects of Real vs. Soundless Acoustic Stimulation During Deep Sleep on Brain Activity, Memory, and Blood Biomarkers in Older Adults (60-85) With Mild Memory Impairment", "official_title": "Preventing Cognitive Decline Using Portable, Non-invasive Sleep Enhancement", "status": "RECRUITING", "phase": "NA", "study_type": "INTERVENTIONAL", "conditions": ["Cognitive Decline", "Alzheimer Disease", "Subjective Cognitive Decline (SCD)", "Mild Cognitive Impairment (MCI)", "Cognitive Impairment, Mild"], "interventions": [{"type": "OTHER", "name": "Phase-locked auditory stimulation (PLAS)", "description": "Intervention: Verum Phase-Locked Auditory Stimulation (PLAS) Using the SleepLoop Device.\n\nThe experimental intervention utilizes the SleepLoop device, a home-use, EEG-based system designed for phase-locked acoustic stimulation (PLAS). The device continuously monitors sleep through EEG (Fpz) alongside electrooculogram (EOG) and electromyogram (EMG) channels. The device employs a closed-loop algorithm that detects slow oscillations (SOs) in the EEG and delivers short sound stimuli (50 ms pink noise) during the positive half-waves of slow waves in slow-wave sleep (SWS). These stimuli are delivered through integrated headphones in the SleepLoop device. The intervention is applied during work days for 4 weeks. The algorithm is only active during SWS and does not deliver stimuli when the participant is awake, or in lighter sleep stages (N1, N2) or REM sleep. The intensity and algorithm sensitivity are individually calibrated for each participant to optimize stimulation."}, {"type": "OTHER", "name": "Sham Phase-Locked Auditory Stimulation", "description": "Participants will undergo the same procedure as the real Phase-Locked Auditory Stimulation (PLAS) intervention. However, during the sham condition, the headphones are turned off, and no auditory stimulation is delivered."}], "primary_outcomes": ["Episodic memory performance differences (between and within subject) according to the experimental condition"], "enrollment": 60, "sponsor": "University of Bern", "collaborators": ["University of Zurich", "Amsterdam University Medical Centers (UMC), Location Academic Medical Center (AMC)"], "start_date": "2025-02-21", "completion_date": "2028-12", "last_updated": "2026-04-03", "summary": "This study aims to explore a non-invasive way to improve memory and slow cognitive decline in older adults by enhancing sleep quality. Dementia, a leading cause of death worldwide, is often associated with disturbed sleep, particularly the loss of deep, slow-wave sleep (SWS). SWS is important for memory and clearing waste from the brain. Poor SWS can worsen memory loss and allow harmful waste to build up, which may increase the risk of dementia. The investigators are testing whether phase-locked auditory stimulation (PLAS) can improve SWS in people at a mild stage of cognitive impairment. PLAS uses short sounds played at specific moments to strengthen slow-wave brain activity during sleep. The investigators previous laboratory based research has shown that this can improve memory and help with clearing waste from the brain. Now, the investigators want to test this in a real-world setting, over a longer period, which is unfeasible in a laboratory setting. In this study, 60 older adults will use home-use devices that deliver either real or sham (soundless) PLAS across two different 4-week periods. Memory will be tested using engaging \"serious games.\" Before and after each experimental period, blood samples will be taken to measure dementia-related markers, and cognitive batteries will be performed. The investigators expect that PLAS will improve sleep, and that this will have a downstream effect on memory and brain clearance, potentially slowing the process of cognitive decline. If successful, this could lead to the development of an affordable treatment that helps people maintain brain health and prevent dementia.", "source_url": "https://clinicaltrials.gov/study/NCT06669546", "scraped_at": "2026-09-05T21:29:54.632792+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT02685969", "title": "Brain Characterization of Amyloid Protein and Glucose Metabolism of ALFA Project Participants", "official_title": "Characterization of Cerebral Amyloid Deposition With 18F-Flutemetamol PET and of Glucose Metabolism With 18F-FDG PET in Individuals Enrolled in the ALFA Project.", "status": "RECRUITING", "phase": "", "study_type": "OBSERVATIONAL", "conditions": ["Alzheimer's Disease"], "interventions": [{"type": "PROCEDURE", "name": "18F-Flutemetamol & 18F-FDG", "description": "Characterization of cerebral amyloid deposition with 18F-Flutemetamol PET and glucose metabolism 18F-FDG PET."}], "primary_outcomes": ["Prevalence of a positive 18F-Flutemetamol scan"], "enrollment": 570, "sponsor": "Barcelonabeta Brain Research Center, Pasqual Maragall Foundation", "collaborators": ["Hospital Clinic of Barcelona", "General Electric"], "start_date": "2017-03-01", "completion_date": "2027-12-31", "last_updated": "2025-05-31", "summary": "Study to understand factors related with the preclinical stages of Alzheimer's Disease and investigate markers that predict its progression. Cross-sectional and single arm study performed on a subgroup of individuals recruited in the ALFA project. Study without therapeutic interest for the research participants (440 participants of the ALFA project who have been selected for being cognitively healthy and in their vast majority are direct descendants of patients diagnosed with Alzheimer's Disease). Each study candidate will be selected from the ALFA project (STUDY 45-65 FPM/2012) according to their clinical characteristics, their compliance to selection criteria and their desire to participate in this study. After signing this study's specific informed consent form, the neuropsychological screening and the brain MRI acquisition will be performed. Once all inclusion criteria are checked, the PET scans with 18F-Flutemetamol and 18F-FDG will be performed", "source_url": "https://clinicaltrials.gov/study/NCT02685969", "scraped_at": "2026-09-05T21:29:54.632792+00:00", "spider_name": "clinicaltrials"}, {"nct_id": "NCT07399171", "title": "Study to Evaluate the Effect of HT-4253 for the Prevention of Alzheimer's Disease in APOE4 Carriers", "official_title": "A Multicenter, Randomized, Double-Blind, Placebo-Controlled Phase 2a Study to Evaluate the Effect of HT-4253 for the Prevention of Alzheimer's Disease in APOE4 Carriers", "status": "RECRUITING", "phase": "PHASE2", "study_type": "INTERVENTIONAL", "conditions": ["Alzheimers Disease"], "interventions": [{"type": "DRUG", "name": "HT-4253", "description": "It is anticipated that 112 participants will be randomized to receive HT-4253 (56 in each study arm)."}, {"type": "OTHER", "name": "Placebo", "description": "It is anticipated that 112 participants wil
